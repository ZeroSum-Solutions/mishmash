<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Shuffle Kinetic Type — Coldwave Studios title card</title>
<!--
  Motion patterns below are original vanilla CSS/JS. No GSAP, Lenis, or any
  third-party source is copied. Two Codrops MIT demos and one MIT structure
  repo supplied the *pattern*, re-wired for this loop:

  - Character decode/scramble wave: inspired by Codrops "TypeShuffleAnimation"
    (MIT). Source demo cycles a random glyph per character on a recursive
    timer, resolving left-to-right once on load/hover. Rewired here into an
    infinite director: resolve left-to-right, breathe, then un-resolve
    right-to-left back into the glyph pool, then re-shuffle the next word.
  - Per-character overflow-hidden translateY line stagger: inspired by
    Codrops "TypographyMotion" (MIT). Source demo is a click-gated single
    reveal; rewired here into a self-driven, repeating line swap between
    headline words using transition-delay: calc(var(--i) * Nms).
  - Fluid vw-based type scale and named cubic-bezier easing tokens: inspired
    by darkroomengineering/satus (MIT) — --ease-out-expo / --ease-in-out-quart
    as the only easing values used anywhere in this file.
-->
<style>
  :root {
    --bg: #050505;
    --paper: #f5f2ec;
    --dim: rgba(245, 242, 236, 0.34);
    --accent: #e0202f;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out-quart: cubic-bezier(0.76, 0, 0.24, 1);
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }
  body { font-family: var(--font-display); }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 7vh 5vw 6vh;
    color: var(--paper);
    background: radial-gradient(120% 120% at 50% 42%, #0c0c0e 0%, var(--bg) 55%, #020202 100%);
    isolation: isolate;
  }

  /* faint CRT-style scanline texture — pure CSS, no assets */
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0.55;
    mix-blend-mode: overlay;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.035) 0px,
      rgba(255, 255, 255, 0.035) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  /* ---- corner frame marks ---- */
  .mark {
    position: absolute;
    width: clamp(20px, 3vw, 34px);
    height: clamp(20px, 3vw, 34px);
    border: 0 solid var(--accent);
    opacity: 0.7;
    animation: kt-ambient 4.4s var(--ease-in-out-quart) infinite;
  }
  .mark-tl { top: 4%; left: 3.4%; border-width: 2px 0 0 2px; }
  .mark-tr { top: 4%; right: 3.4%; border-width: 2px 2px 0 0; animation-delay: -1.1s; }
  .mark-bl { bottom: 4%; left: 3.4%; border-width: 0 0 2px 2px; animation-delay: -2.2s; }
  .mark-br { bottom: 4%; right: 3.4%; border-width: 0 2px 2px 0; animation-delay: -3.3s; }

  @keyframes kt-ambient {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.85; }
  }

  /* ---- rec indicator + timecode ---- */
  .rec {
    position: absolute;
    top: 4.6%;
    left: 8.4%;
    display: flex;
    align-items: center;
    gap: 0.55em;
    font-family: var(--font-mono);
    font-size: clamp(0.58rem, calc(19 / 1920 * 100vw), 0.82rem);
    letter-spacing: 0.28em;
    color: rgba(245, 242, 236, 0.6);
  }
  .rec-dot {
    width: 0.55em;
    height: 0.55em;
    border-radius: 50%;
    background: var(--accent);
    animation: kt-blink 2.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }
  @keyframes kt-blink {
    0%, 100% { opacity: 1; }
    8%  { opacity: 0.18; }
    16% { opacity: 1; }
    52% { opacity: 1; }
    60% { opacity: 0.18; }
    68% { opacity: 1; }
  }
  #timecode {
    position: absolute;
    bottom: 4.6%;
    right: 8.4%;
    font-family: var(--font-mono);
    font-size: clamp(0.58rem, calc(19 / 1920 * 100vw), 0.82rem);
    letter-spacing: 0.18em;
    color: rgba(245, 242, 236, 0.55);
  }

  /* ---- kicker ---- */
  .kicker {
    font-size: clamp(0.62rem, calc(23 / 1920 * 100vw), 1.05rem);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    font-weight: 600;
    color: rgba(245, 242, 236, 0.62);
    animation: kt-fade-up 1s var(--ease-out-expo) both;
  }

  /* ---- headline: the shuffle/decode stage ---- */
  .headline-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2vh;
    width: 100%;
  }
  .word-group {
    display: flex;
    justify-content: center;
    line-height: 0.9;
    transform-origin: 50% 55%;
  }
  .char-cell {
    display: inline-block;
    overflow: hidden;
    height: 1em;
    font-size: clamp(3.1rem, calc(232 / 1920 * 100vw), 12rem);
    font-weight: 800;
    letter-spacing: -0.015em;
    text-transform: uppercase;
    line-height: 1;
  }
  .char-inner {
    display: inline-block;
    color: var(--dim);
    transition:
      transform 0.46s var(--ease-out-expo),
      color 0.2s ease-out,
      text-shadow 0.3s ease-out;
    transition-delay: calc(var(--i) * 24ms), 0s, 0s;
  }
  .char-inner.st-enter  { transform: translateY(118%); }
  .char-inner.st-rest   { transform: translateY(0%); }
  .char-inner.st-exit   { transform: translateY(-118%); }
  .char-inner.st-pending  { color: var(--dim); text-shadow: none; }
  .char-inner.st-flash    { color: var(--accent); text-shadow: 0 0 24px rgba(224, 32, 47, 0.85), 0 0 3px rgba(224, 32, 47, 0.9); }
  .char-inner.st-resolved { color: var(--paper); text-shadow: none; }

  @keyframes kt-breathe {
    0%   { transform: scale(1);    font-variation-settings: "wght" 560, "wdth" 100; }
    30%  { transform: scale(0.94); font-variation-settings: "wght" 380, "wdth" 94; }
    65%  { transform: scale(1.03); font-variation-settings: "wght" 780, "wdth" 107; }
    100% { transform: scale(1);    font-variation-settings: "wght" 560, "wdth" 100; }
  }
  .word-group.is-breathing { animation: kt-breathe 0.8s var(--ease-in-out-quart) 2; }

  .rule {
    width: 0;
    height: 2px;
    background: var(--accent);
    transition: width 0.9s var(--ease-in-out-quart);
  }
  .rule.is-grown { width: min(340px, 22vw); }

  /* ---- byline ---- */
  .byline {
    font-size: clamp(0.66rem, calc(27 / 1920 * 100vw), 1.15rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 600;
    color: rgba(245, 242, 236, 0.82);
    animation: kt-fade-up 1s var(--ease-out-expo) 0.12s both;
  }
  .byline .outline-word {
    color: transparent;
    -webkit-text-stroke: 1.2px var(--accent);
    paint-order: stroke;
  }
  @supports not (-webkit-text-stroke: 1px black) {
    .byline .outline-word { color: var(--accent); -webkit-text-stroke: 0; }
  }

  @keyframes kt-fade-up {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- reduced motion: composed static fallback ---- */
  @media (prefers-reduced-motion: reduce) {
    .kicker, .byline, .mark, .rec-dot { animation: none !important; opacity: 1 !important; }
    .char-inner, .rule { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="mark mark-tl"></div>
    <div class="mark mark-tr"></div>
    <div class="mark mark-bl"></div>
    <div class="mark mark-br"></div>

    <div class="rec"><span class="rec-dot"></span>REC</div>
    <div id="timecode">00:00:00:00</div>

    <p class="kicker">Coldwave Studios</p>

    <div class="headline-wrap">
      <div class="word-group" id="headline"></div>
      <div class="rule" id="rule"></div>
    </div>

    <p class="byline">A <span class="outline-word">Limited</span> Series</p>
  </div>

  <script>
    (function () {
      "use strict";

      var WORDS = ["SIGNAL", "DRIFT"];
      var GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&*+=-/\\<>~^".split("");
      var SCRAMBLE_MS = 15;
      var CHAR_STAGGER = 90;   // ms between each cell's resolve moment in the wave
      var FLASH_MS = 170;      // how long the crimson resolve-flash holds
      var SETTLE_MS = 260;     // buffer for the color transition to finish
      var HOLD_MS = 1600;      // breathe/hold duration, matches the CSS animation
      var ENTER_EXIT_MS = 460; // base slide duration (matches CSS transition)
      var STAGGER_STEP = 24;   // ms, matches transition-delay: calc(var(--i)*24ms)

      var headline = document.getElementById("headline");
      var rule = document.getElementById("rule");
      var timecodeEl = document.getElementById("timecode");
      var reduceMQ = window.matchMedia("(prefers-reduced-motion: reduce)");

      function pad2(n) { return n < 10 ? "0" + n : String(n); }
      function randomGlyph(exclude) {
        var g;
        do { g = GLYPHS[(Math.random() * GLYPHS.length) | 0]; }
        while (g === exclude && GLYPHS.length > 1);
        return g;
      }
      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      function startScramble(c) {
        c.scrambling = true;
        (function tick() {
          if (!c.scrambling) return;
          c.inner.textContent = randomGlyph(c.inner.textContent);
          c.timer = setTimeout(tick, SCRAMBLE_MS);
        })();
      }
      function stopScramble(c) {
        c.scrambling = false;
        clearTimeout(c.timer);
      }

      function buildWord(word, container) {
        container.innerHTML = "";
        var cells = [];
        for (var i = 0; i < word.length; i++) {
          var ch = word[i];
          var cell = document.createElement("span");
          cell.className = "char-cell";
          cell.style.setProperty("--i", i);
          var inner = document.createElement("span");
          inner.className = "char-inner st-enter st-pending";
          inner.textContent = randomGlyph(ch);
          cell.appendChild(inner);
          container.appendChild(cell);
          cells.push({ cell: cell, inner: inner, target: ch, scrambling: false, timer: null });
        }
        return cells;
      }

      function enterExitTotal(n) { return (n - 1) * STAGGER_STEP + ENTER_EXIT_MS; }
      function waveTotal(n) { return (n - 1) * CHAR_STAGGER + FLASH_MS + SETTLE_MS; }

      // A single continuous async loop is the re-entrancy guard: there is only
      // ever one call site advancing the sequence, so no isAnimating flag is
      // needed to prevent overlap.
      async function playWord(word) {
        var cells = buildWord(word, headline);

        // Enter: cells slide up into place while already scrambling underneath.
        headline.offsetHeight; // force reflow so the enter transition fires
        requestAnimationFrame(function () {
          cells.forEach(function (c) {
            c.inner.classList.remove("st-enter");
            c.inner.classList.add("st-rest");
          });
        });
        cells.forEach(startScramble);
        await sleep(enterExitTotal(cells.length) + 120);

        // Decode wave: resolve left-to-right, reading each cell's neighbor's
        // already-settled state as the cue to advance the wave one step.
        cells.forEach(function (c, i) {
          setTimeout(function () {
            stopScramble(c);
            c.inner.textContent = c.target;
            c.inner.classList.remove("st-pending");
            c.inner.classList.add("st-flash");
            setTimeout(function () {
              c.inner.classList.remove("st-flash");
              c.inner.classList.add("st-resolved");
            }, FLASH_MS);
          }, i * CHAR_STAGGER);
        });
        await sleep(waveTotal(cells.length));

        // Hold + breathe: weight/width axis pulse under a scale rhythm.
        headline.classList.add("is-breathing");
        rule.classList.add("is-grown");
        await sleep(HOLD_MS);
        headline.classList.remove("is-breathing");

        // Reverse wave: un-resolve right-to-left, back into the glyph pool.
        for (var i = cells.length - 1; i >= 0; i--) {
          (function (c, delay) {
            setTimeout(function () {
              c.inner.classList.remove("st-resolved");
              c.inner.classList.add("st-flash");
              setTimeout(function () {
                c.inner.classList.remove("st-flash");
                c.inner.classList.add("st-pending");
                c.inner.textContent = randomGlyph(c.target);
                startScramble(c);
              }, FLASH_MS);
            }, delay);
          })(cells[i], (cells.length - 1 - i) * CHAR_STAGGER);
        }
        await sleep(waveTotal(cells.length));
        rule.classList.remove("is-grown");
        await sleep(180);

        // Exit: slide up and out, still scrambling, then re-shuffle begins.
        cells.forEach(function (c) {
          c.inner.classList.remove("st-rest");
          c.inner.classList.add("st-exit");
        });
        await sleep(enterExitTotal(cells.length) + 60);
        cells.forEach(stopScramble);
      }

      async function directorLoop() {
        var idx = 0;
        for (;;) {
          await playWord(WORDS[idx % WORDS.length]);
          idx++;
        }
      }

      function startTimecode() {
        var start = performance.now();
        function tick(now) {
          var totalFrames = Math.floor(((now - start) / 1000) * 30);
          var ff = totalFrames % 30;
          var totalSeconds = Math.floor(totalFrames / 30);
          var ss = totalSeconds % 60;
          var mm = Math.floor(totalSeconds / 60) % 60;
          var hh = Math.floor(totalSeconds / 3600);
          timecodeEl.textContent = pad2(hh) + ":" + pad2(mm) + ":" + pad2(ss) + ":" + pad2(ff);
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }

      function renderStaticFrame() {
        var cells = buildWord(WORDS[0], headline);
        cells.forEach(function (c) {
          c.inner.classList.remove("st-enter", "st-pending");
          c.inner.classList.add("st-rest", "st-resolved");
          c.inner.textContent = c.target;
        });
        rule.classList.add("is-grown");
      }

      if (reduceMQ.matches) {
        renderStaticFrame();
      } else {
        directorLoop();
        startTimecode();
      }
    })();
  </script>
</body>
</html>
