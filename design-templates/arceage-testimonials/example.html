<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arceage Ag — Customer Feedback</title>
<meta name="description" content="Customer feedback testimonial carousel for Arceage Ag, a farm harvesting and machinery services partner." />


<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --bg-page: #000000;
    --bg-section: #ffffff;
    --text-on-light: #000000;
    --divider: #D9D9D9;
    --btn-bg: #D9D9D9;
    --btn-bg-hover: #c9c9c9;
    --author-title: #6b7280;
    /* Chromatic accent: not part of the original monochrome design; used only
       for the additive keyboard focus ring so MishMash's recolor pass has a
       genuine chromatic token to act on without altering the default look. */
    --accent: #4e85bf;
  }

  * {
    box-sizing: border-box;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--bg-page);
    color: #ffffff;
    font-family: "Barlow", ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 0;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Section shell ---------- */
  .feedback-section {
    width: 100%;
    background: var(--bg-section);
    color: var(--text-on-light);
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  @media (min-width: 768px) {
    .feedback-section {
      padding: 6rem 3rem;
    }
  }
  @media (min-width: 1024px) {
    .feedback-section {
      padding-left: 120px;
      padding-right: 120px;
    }
  }

  .feedback-inner {
    width: 100%;
    opacity: 0;
  }
  .feedback-inner.in-view {
    opacity: 1;
  }

  /* ---------- Title ---------- */
  .feedback-title {
    font-size: 0.875rem;
    line-height: 1.4;
    margin: 0 0 1.5rem;
    font-weight: 500;
    letter-spacing: 0.025em;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    transition-delay: 0ms;
  }
  @media (min-width: 768px) {
    .feedback-title {
      font-size: 1rem;
    }
  }
  .feedback-inner.in-view .feedback-title {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------- Dividers ---------- */
  .divider {
    width: 100%;
    height: 1px;
    background: var(--divider);
    transform-origin: left;
    transform: scaleX(0);
    transition: transform 0.8s ease-out;
  }
  .divider-top {
    margin-bottom: 3rem;
    transition-delay: 50ms;
  }
  .divider-bottom {
    margin-top: 3rem;
    margin-bottom: 2rem;
    transition-delay: 150ms;
  }
  @media (min-width: 768px) {
    .divider-top {
      margin-bottom: 5rem;
    }
    .divider-bottom {
      margin-top: 5rem;
    }
  }
  .feedback-inner.in-view .divider {
    transform: scaleX(1);
  }

  /* ---------- Quote carousel ---------- */
  .quote-area {
    position: relative;
    overflow: hidden;
    min-height: 300px;
    display: flex;
    align-items: center;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    transition-delay: 100ms;
  }
  @media (min-width: 768px) {
    .quote-area {
      min-height: 250px;
    }
  }
  .feedback-inner.in-view .quote-area {
    opacity: 1;
    transform: translateY(0);
  }

  .quote-slide {
    width: 100%;
    will-change: transform, opacity;
    transition: opacity 0.2s ease-out;
  }

  .quote-text {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 300;
    line-height: 1.375;
    text-align: right;
    letter-spacing: -0.025em;
  }
  @media (min-width: 768px) {
    .quote-text {
      font-size: 2.25rem;
      line-height: 1.25;
    }
  }
  @media (min-width: 1024px) {
    .quote-text {
      font-size: 44px;
    }
  }

  .tw-char {
    opacity: 0;
    transition: opacity 0.3s ease-out;
  }
  .tw-char.visible {
    opacity: 1;
  }

  /* ---------- Author + nav row ---------- */
  .author-nav-row {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    gap: 1.5rem;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    transition-delay: 200ms;
  }
  @media (min-width: 640px) {
    .author-nav-row {
      flex-direction: row;
    }
  }
  .feedback-inner.in-view .author-nav-row {
    opacity: 1;
    transform: translateY(0);
  }

  .author-info {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.2s ease-out, transform 0.2s ease-out;
  }
  .author-info.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  .author-info.is-exiting {
    opacity: 0;
    transform: translateY(-10px);
  }
  @media (min-width: 640px) {
    .author-info {
      width: auto;
    }
  }

  .avatar {
    width: 3.5rem;
    height: 3.5rem;
    border-radius: 9999px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .author-name {
    margin: 0;
    font-weight: 500;
    font-size: 1.125rem;
  }
  .author-name cite {
    font-style: normal;
  }

  .author-title {
    margin: 0;
    color: var(--author-title);
    font-size: 0.875rem;
  }

  /* ---------- Nav arrows ---------- */
  .nav-arrows {
    display: flex;
    gap: 0.5rem;
    width: 100%;
    justify-content: flex-end;
  }
  @media (min-width: 640px) {
    .nav-arrows {
      width: auto;
    }
  }

  .arrow-btn {
    width: 3.5rem;
    height: 3.5rem;
    border-radius: 9999px;
    background: var(--btn-bg);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.15s ease-out;
    padding: 0;
  }
  .arrow-btn:hover {
    background: var(--btn-bg-hover);
  }
  .arrow-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .arrow-btn svg {
    width: 1.5rem;
    height: 1.5rem;
    stroke: #000000;
    stroke-width: 1.5;
    fill: none;
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .feedback-inner,
    .feedback-title,
    .divider,
    .quote-area,
    .author-nav-row,
    .author-info,
    .tw-char,
    .quote-slide {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
    .feedback-inner,
    .feedback-title,
    .divider,
    .quote-area,
    .author-nav-row,
    .author-info {
      opacity: 1 !important;
      transform: none !important;
    }
    .tw-char {
      opacity: 1 !important;
    }
  }
</style>
</head>
<body>
<section id="feedback" class="feedback-section">
  <div class="feedback-inner" id="feedbackInner">
    <h2 class="feedback-title">
      <span class="tw-visual" id="titleVisual" aria-hidden="true"></span><span class="sr-only">Customer Feedback</span>
    </h2>

    <div class="divider divider-top" aria-hidden="true"></div>

    <div class="quote-area">
      <div class="quote-slide" id="quoteSlide">
        <blockquote class="quote-text" id="quoteText">
          <span class="tw-visual" id="quoteVisual" aria-hidden="true"></span><span class="sr-only" id="quoteSr" aria-live="polite"></span>
        </blockquote>
      </div>
    </div>

    <div class="divider divider-bottom" aria-hidden="true"></div>

    <div class="author-nav-row">
      <div class="author-info" id="authorInfo">
        <img class="avatar" id="authorAvatar" src="assets/avatar-maranda.jpg" alt="" width="56" height="56" />
        <div>
          <h3 class="author-name"><cite><span class="tw-visual" id="nameVisual" aria-hidden="true"></span><span class="sr-only" id="nameSr" aria-live="polite"></span></cite></h3>
          <p class="author-title"><span class="tw-visual" id="roleVisual" aria-hidden="true"></span><span class="sr-only" id="roleSr" aria-live="polite"></span></p>
        </div>
      </div>
      <div class="nav-arrows">
        <button type="button" class="arrow-btn" id="prevBtn" aria-label="Previous feedback">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="arrow-btn" id="nextBtn" aria-label="Next feedback">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>
<script>
(function () {
  "use strict";

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var feedbacks = [
    {
      quote: "«Working with the Acreage Ag team gave us a competitive edge in bringing our crops to market. Their technical expertise, machinery, and customer service are outstanding. We consider them a key partner for all our harvesting needs»",
      author: "Maranda Walsh",
      title: "Operations Manager, GreenAcres Farms",
      avatar: "assets/avatar-maranda.jpg"
    },
    {
      quote: "«The team's dedication and innovative approach transformed our farm operations. They delivered a high-quality harvest on time and within budget. We highly recommend their services.»",
      author: "John Doe",
      title: "Owner, Valley Wheat Producers",
      avatar: "assets/avatar-john.jpg"
    },
    {
      quote: "«Exceptional service and outstanding yields. The operators were highly skilled and integrated seamlessly with our in-house farm hands. A truly remarkable partnership.»",
      author: "Sarah Smith",
      title: "Chief Agronomist, HarvestYield Co.",
      avatar: "assets/avatar-sarah.jpg"
    }
  ];

  var count = feedbacks.length;
  var currentIndex = 0;
  var isAnimating = false;

  var feedbackInner = document.getElementById("feedbackInner");
  var titleVisual = document.getElementById("titleVisual");
  var quoteSlide = document.getElementById("quoteSlide");
  var quoteVisual = document.getElementById("quoteVisual");
  var quoteSr = document.getElementById("quoteSr");
  var authorInfo = document.getElementById("authorInfo");
  var authorAvatar = document.getElementById("authorAvatar");
  var nameVisual = document.getElementById("nameVisual");
  var nameSr = document.getElementById("nameSr");
  var roleVisual = document.getElementById("roleVisual");
  var roleSr = document.getElementById("roleSr");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");

  // Character-by-character reveal, ported from the source design's
  // Typewriter component (staggerChildren-style delay per character).
  // delayMs: time before the first character starts; speedMs: stagger step.
  function typeChars(el, text, delayMs, speedMs) {
    el.textContent = "";
    if (reduceMotion) {
      el.textContent = text;
      return;
    }
    var frag = document.createDocumentFragment();
    var spans = [];
    for (var i = 0; i < text.length; i++) {
      var span = document.createElement("span");
      span.className = "tw-char";
      span.textContent = text[i];
      span.style.transitionDelay = (delayMs + i * speedMs) + "ms";
      frag.appendChild(span);
      spans.push(span);
    }
    el.appendChild(frag);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        for (var j = 0; j < spans.length; j++) {
          spans[j].classList.add("visible");
        }
      });
    });
  }

  // Spring physics runner matching the source design's Motion transition
  // (stiffness: 300, damping: 30, implicit mass: 1) used for the carousel's
  // directional slide.
  function runSpring(from, to, onUpdate, onComplete) {
    if (reduceMotion) {
      onUpdate(to);
      if (onComplete) onComplete();
      return;
    }
    var stiffness = 300;
    var damping = 30;
    var mass = 1;
    var x = from;
    var v = 0;
    var lastTime = null;

    function step(now) {
      if (lastTime === null) lastTime = now;
      var dt = Math.min((now - lastTime) / 1000, 1 / 30);
      lastTime = now;
      var force = -stiffness * (x - to) - damping * v;
      var accel = force / mass;
      v += accel * dt;
      x += v * dt;
      onUpdate(x);
      if (Math.abs(x - to) < 0.4 && Math.abs(v) < 0.4) {
        onUpdate(to);
        if (onComplete) onComplete();
        return;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function renderAuthor(feedback) {
    authorAvatar.src = feedback.avatar;
    authorAvatar.alt = "";
  }

  function playInitialReveal() {
    var fb = feedbacks[currentIndex];
    typeChars(titleVisual, "Customer Feedback", 0, 12);
    typeChars(quoteVisual, fb.quote, 300, 12);
    quoteSr.textContent = fb.quote;
    renderAuthor(fb);
    setTimeout(function () {
      authorInfo.classList.add("is-visible");
    }, 200);
    typeChars(nameVisual, fb.author, 600, 12);
    nameSr.textContent = fb.author;
    typeChars(roleVisual, fb.title, 700, 12);
    roleSr.textContent = fb.title;
  }

  var observer = new IntersectionObserver(
    function (entries) {
      if (entries[0] && entries[0].isIntersecting) {
        feedbackInner.classList.add("in-view");
        playInitialReveal();
        observer.disconnect();
      }
    },
    { threshold: 0.1 }
  );
  observer.observe(feedbackInner);

  function goToSlide(direction) {
    if (isAnimating) return;
    isAnimating = true;
    prevBtn.disabled = true;
    nextBtn.disabled = true;

    var newIndex = (currentIndex + direction + count) % count;
    var exitX = direction > 0 ? -100 : 100;
    var enterX = direction > 0 ? 100 : -100;

    authorInfo.classList.remove("is-visible");
    authorInfo.classList.add("is-exiting");

    quoteSlide.style.opacity = "0";
    runSpring(
      0,
      exitX,
      function (x) {
        quoteSlide.style.transform = "translateX(" + x.toFixed(2) + "px)";
      },
      function () {
        var fb = feedbacks[newIndex];
        currentIndex = newIndex;

        quoteSlide.style.transform = "translateX(" + enterX + "px)";
        typeChars(quoteVisual, fb.quote, 200, 12);
        quoteSr.textContent = fb.quote;
        renderAuthor(fb);
        typeChars(nameVisual, fb.author, 400, 12);
        nameSr.textContent = fb.author;
        typeChars(roleVisual, fb.title, 500, 12);
        roleSr.textContent = fb.title;

        authorInfo.classList.remove("is-exiting");
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            authorInfo.classList.add("is-visible");
          });
        });

        requestAnimationFrame(function () {
          quoteSlide.style.opacity = "1";
        });
        runSpring(
          enterX,
          0,
          function (x) {
            quoteSlide.style.transform = "translateX(" + x.toFixed(2) + "px)";
          },
          function () {
            quoteSlide.style.transform = "translateX(0px)";
            isAnimating = false;
            prevBtn.disabled = false;
            nextBtn.disabled = false;
          }
        );
      }
    );
  }

  prevBtn.addEventListener("click", function () {
    goToSlide(-1);
  });
  nextBtn.addEventListener("click", function () {
    goToSlide(1);
  });
})();
</script>
</body>
</html>
