<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ClearInvoice — Manage your online store while you save 3x on operating cost</title>
	<meta
		name="description"
		content="ClearInvoice SaaS hero: a full-bleed muted video backdrop behind a glassy dark navbar, a tight three-line headline, gradient and glass CTA buttons, and a three-avatar social-proof row."
	>
	<link
		rel="icon"
		href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b10'/%3E%3Cpath d='M9 12h14M9 16h14M9 20h9' stroke='%23ee7926' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
	>


	<link rel="stylesheet" href="fonts/fonts.css">
	<style>
		:root {
			--bg: #07070a;
			--fg: #ffffff;
			--muted: rgba(255, 255, 255, 0.7);
			--subhead: rgba(255, 255, 255, 0.9);

			/* top bar + brand gradient — the page's chromatic identity */
			--grad-a: #ccccff;
			--grad-b: #e7d04c;
			--grad-c: #31fb78;

			/* primary CTA gradient */
			--accent-a: #ff3300;
			--accent-b: #ee7926;
			--accent-glow: rgba(234, 88, 12, 0.2);
			--accent-glow-strong: rgba(234, 88, 12, 0.6);

			--glass-border: rgba(255, 255, 255, 0.2);
			--glass-border-dark: rgba(0, 0, 0, 0.05);
			--nav-bg: rgba(7, 7, 10, 0.55);

			--ease-out: cubic-bezier(0.23, 1, 0.32, 1);
		}

		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			padding: 0;
			background: var(--bg);
		}

		body {
			font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif;
			-webkit-font-smoothing: antialiased;
			color: var(--fg);
			overflow-x: hidden;
		}

		main {
			display: block;
		}

		a {
			color: inherit;
			text-decoration: none;
		}

		button {
			font-family: inherit;
		}

		/* ---------------------------------------------------------------- */
		/* Top gradient bar                                                 */
		/* ---------------------------------------------------------------- */

		.top-bar {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			height: 5px;
			z-index: 60;
			background: linear-gradient(90deg, var(--grad-a) 0%, var(--grad-b) 50%, var(--grad-c) 100%);
		}

		/* ---------------------------------------------------------------- */
		/* Navbar                                                            */
		/* ---------------------------------------------------------------- */

		.site-header {
			position: fixed;
			top: 5px;
			left: 0;
			right: 0;
			z-index: 50;
		}

		.nav {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			max-width: 84rem;
			margin: 0 auto;
			padding: 0.9rem 1.5rem;
			background: var(--nav-bg);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			border-bottom: 1px solid rgba(255, 255, 255, 0.08);
		}

		.nav-logo {
			display: inline-flex;
			align-items: center;
			gap: 0.55rem;
			font-family: 'Manrope', 'Geist', sans-serif;
			font-weight: 700;
			font-size: 1.15rem;
			letter-spacing: -0.01em;
			flex-shrink: 0;
		}

		.nav-logo-mark {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 30px;
			height: 30px;
			border-radius: 9px;
			background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
			flex-shrink: 0;
		}

		.nav-logo-mark svg {
			width: 16px;
			height: 16px;
		}

		.nav-links {
			display: flex;
			align-items: center;
			gap: 2rem;
			list-style: none;
			margin: 0;
			padding: 0;
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
		}

		.nav-links a {
			font-size: 0.9rem;
			color: var(--muted);
			transition: color 200ms var(--ease-out);
		}

		.nav-links a:hover {
			color: var(--fg);
		}

		.nav-auth {
			display: flex;
			align-items: center;
			gap: 0.85rem;
			flex-shrink: 0;
		}

		.nav-signin {
			font-size: 0.9rem;
			color: var(--muted);
			transition: color 200ms var(--ease-out);
		}

		.nav-signin:hover {
			color: var(--fg);
		}

		.nav-signup {
			display: inline-flex;
			align-items: center;
			padding: 0.5rem 1.15rem;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.92);
			color: #0b0b10;
			font-size: 0.85rem;
			font-weight: 600;
			box-shadow: inset 0 0 0 1.5px var(--glass-border-dark);
			transition: transform 200ms var(--ease-out), background 200ms var(--ease-out);
		}

		.nav-signup:hover {
			transform: scale(1.05);
			background: #ffffff;
		}

		.nav-toggle {
			display: none;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 5px;
			width: 40px;
			height: 40px;
			border: none;
			border-radius: 8px;
			background: transparent;
			cursor: pointer;
			flex-shrink: 0;
		}

		.nav-toggle span {
			display: block;
			width: 20px;
			height: 1.5px;
			background: var(--fg);
			border-radius: 2px;
			transition: transform 240ms var(--ease-out), opacity 240ms var(--ease-out);
		}

		.nav-toggle.open span:nth-child(1) {
			transform: translateY(6.5px) rotate(45deg);
		}

		.nav-toggle.open span:nth-child(2) {
			opacity: 0;
		}

		.nav-toggle.open span:nth-child(3) {
			transform: translateY(-6.5px) rotate(-45deg);
		}

		.mobile-menu {
			display: flex;
			flex-direction: column;
			gap: 1.1rem;
			max-height: 0;
			overflow: hidden;
			padding: 0 1.5rem;
			background: rgba(7, 7, 10, 0.92);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			border-bottom: 1px solid rgba(255, 255, 255, 0.08);
			transition: max-height 320ms var(--ease-out), padding 320ms var(--ease-out);
		}

		.mobile-menu.open {
			max-height: 22rem;
			padding: 1.25rem 1.5rem 1.75rem;
		}

		.mobile-menu a,
		.mobile-menu .nav-signin {
			font-size: 1rem;
			color: var(--muted);
		}

		.mobile-menu .nav-signup {
			align-self: flex-start;
		}

		/* ---------------------------------------------------------------- */
		/* Hero                                                              */
		/* ---------------------------------------------------------------- */

		.hero {
			position: relative;
			min-height: 100vh;
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
			background: var(--bg);
		}

		.hero-bg,
		.hero-bg-fallback {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			z-index: 0;
		}

		.hero-bg-fallback {
			display: none;
		}

		.hero-content {
			position: relative;
			z-index: 10;
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
			padding: 8rem 1.5rem 3rem;
			max-width: 52rem;
			margin: 0 auto;
		}

		.hero-headline {
			margin: 0;
			font-family: 'Manrope', 'Geist', sans-serif;
			font-weight: 600;
			font-size: clamp(2.1rem, 6.4vw, 4.4rem);
			line-height: 1.05;
			letter-spacing: -0.02em;
			color: var(--fg);
			opacity: 0;
			animation: heroFadeUp 800ms var(--ease-out) forwards;
			animation-delay: 0.1s;
		}

		.hero-subhead {
			margin: 1.4rem auto 0;
			max-width: 34rem;
			font-size: clamp(1rem, 2vw, 1.2rem);
			line-height: 1.5;
			color: var(--subhead);
			font-weight: 400;
			opacity: 0;
			animation: heroFadeUp 800ms var(--ease-out) forwards;
			animation-delay: 0.25s;
		}

		.hero-actions {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			gap: 1rem;
			margin-top: 2.25rem;
			opacity: 0;
			animation: heroFadeUp 800ms var(--ease-out) forwards;
			animation-delay: 0.4s;
		}

		/* Primary button — gradient fill, glassy inner stroke, glow, sliding arrow */
		.btn-primary {
			position: relative;
			display: inline-flex;
			align-items: center;
			gap: 0.4rem;
			padding: 0.85rem 1.6rem;
			border: none;
			border-radius: 999px;
			background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
			box-shadow: inset 0 0 0 1.5px var(--glass-border);
			color: #ffffff;
			font-size: 0.95rem;
			font-weight: 600;
			cursor: pointer;
			transition: transform 260ms var(--ease-out);
		}

		.btn-primary::before {
			content: "";
			position: absolute;
			inset: -10px;
			z-index: -1;
			border-radius: 999px;
			background: var(--accent-glow);
			filter: blur(16px);
			opacity: 0.2;
			transition: opacity 260ms var(--ease-out);
		}

		.btn-primary .btn-arrow {
			display: inline-flex;
			width: 0;
			opacity: 0;
			transform: translateX(-8px);
			overflow: hidden;
			transition: width 260ms var(--ease-out), opacity 220ms var(--ease-out), transform 260ms var(--ease-out);
		}

		.btn-primary .btn-arrow svg {
			width: 16px;
			height: 16px;
			flex-shrink: 0;
		}

		.btn-primary:hover {
			transform: scale(1.05);
		}

		.btn-primary:hover::before {
			opacity: 0.6;
		}

		.btn-primary:hover .btn-arrow {
			width: 16px;
			opacity: 1;
			transform: translateX(0);
		}

		.btn-primary:active {
			transform: scale(1.01);
			transition-duration: 140ms;
		}

		/* Secondary button — translucent white glass */
		.btn-secondary {
			display: inline-flex;
			align-items: center;
			padding: 0.85rem 1.6rem;
			border: none;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.9);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			box-shadow: inset 0 0 0 1.5px var(--glass-border-dark);
			color: #0b0b10;
			font-size: 0.95rem;
			font-weight: 600;
			cursor: pointer;
			transition: transform 260ms var(--ease-out), background 260ms var(--ease-out);
		}

		.btn-secondary:hover {
			transform: scale(1.05);
			background: #ffffff;
		}

		.btn-secondary:active {
			transform: scale(1.01);
			transition-duration: 140ms;
		}

		/* Social proof */
		.social-proof {
			display: flex;
			align-items: center;
			gap: 0.85rem;
			margin-top: 2.75rem;
			opacity: 0;
			animation: heroFadeUp 800ms var(--ease-out) forwards;
			animation-delay: 0.55s;
		}

		.avatar-stack {
			display: flex;
		}

		.avatar-stack .avatar {
			width: 34px;
			height: 34px;
			border-radius: 50%;
			border: 2px solid var(--bg);
			margin-left: -10px;
			display: block;
		}

		.avatar-stack .avatar:first-child {
			margin-left: 0;
		}

		.social-proof-text {
			font-size: 0.88rem;
			color: var(--muted);
		}

		@keyframes heroFadeUp {
			from {
				opacity: 0;
				transform: translateY(22px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		/* ---------------------------------------------------------------- */
		/* Responsive                                                        */
		/* ---------------------------------------------------------------- */

		@media (max-width: 860px) {
			.nav-links {
				display: none;
			}

			.nav-auth {
				display: none;
			}

			.nav-toggle {
				display: flex;
			}
		}

		@media (max-width: 640px) {
			.hero-content {
				padding-top: 7rem;
			}

			.hero-actions {
				flex-direction: column;
				width: 100%;
			}

			.btn-primary,
			.btn-secondary {
				width: 100%;
				justify-content: center;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.hero-bg {
				display: none;
			}

			.hero-bg-fallback {
				display: block;
			}

			.hero-headline,
			.hero-subhead,
			.hero-actions,
			.social-proof {
				animation: none;
				opacity: 1;
				transform: none;
			}

			.btn-primary,
			.btn-secondary,
			.nav-signup,
			.nav-toggle span,
			.mobile-menu {
				transition: none;
			}

			.btn-primary:hover,
			.btn-secondary:hover,
			.nav-signup:hover {
				transform: none;
			}

			.btn-primary .btn-arrow {
				display: none;
			}
		}
	</style>
</head>
<body>
	<div class="top-bar" aria-hidden="true"></div>

	<header class="site-header">
		<nav class="nav" aria-label="Primary">
			<a class="nav-logo" href="#top" aria-label="ClearInvoice home">
				<span class="nav-logo-mark" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
						<path d="M6 8h12M6 12h12M6 16h7"></path>
					</svg>
				</span>
				<span>ClearInvoice</span>
			</a>

			<ul class="nav-links">
				<li><a href="#features">Features</a></li>
				<li><a href="#pricing">Pricing</a></li>
				<li><a href="#reviews">Reviews</a></li>
			</ul>

			<div class="nav-auth">
				<a class="nav-signin" href="#signin">Sign In</a>
				<a class="nav-signup" href="#signup">Sign Up</a>
			</div>

			<button
				class="nav-toggle"
				id="navToggle"
				type="button"
				aria-label="Toggle menu"
				aria-expanded="false"
				aria-controls="mobileMenu"
			>
				<span></span>
				<span></span>
				<span></span>
			</button>
		</nav>

		<div class="mobile-menu" id="mobileMenu">
			<a href="#features">Features</a>
			<a href="#pricing">Pricing</a>
			<a href="#reviews">Reviews</a>
			<a class="nav-signin" href="#signin">Sign In</a>
			<a class="nav-signup" href="#signup">Sign Up</a>
		</div>
	</header>

	<main id="top">
		<section class="hero" aria-label="ClearInvoice introduction">
			<video
				class="hero-bg"
				autoplay
				loop
				muted
				playsinline
				poster="assets/hero-poster.jpg"
				aria-hidden="true"
			>
				<source src="assets/hero-bg.mp4" type="video/mp4">
			</video>
			<img class="hero-bg-fallback" src="assets/hero-poster.jpg" alt="" aria-hidden="true">

			<div class="hero-content">
				<h1 class="hero-headline">Manage your online store while save 3x operating cost</h1>
				<p class="hero-subhead">ClearInvoice takes the hassle out of billing with easy-to-use tools.</p>

				<div class="hero-actions">
					<button type="button" class="btn-primary">
						<span class="btn-arrow" aria-hidden="true">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
								<line x1="5" y1="12" x2="19" y2="12"></line>
								<polyline points="12 5 19 12 12 19"></polyline>
							</svg>
						</span>
						<span>Start free trial</span>
					</button>
					<button type="button" class="btn-secondary">
						<span>Book a demo</span>
					</button>
				</div>

				<div class="social-proof">
					<div class="avatar-stack" aria-hidden="true">
						<svg class="avatar" viewBox="0 0 34 34"><rect width="34" height="34" fill="#ee7926"></rect><circle cx="17" cy="13" r="6" fill="rgba(255,255,255,0.85)"></circle><circle cx="17" cy="34" r="13" fill="rgba(255,255,255,0.85)"></circle></svg>
						<svg class="avatar" viewBox="0 0 34 34"><rect width="34" height="34" fill="#31fb78"></rect><circle cx="17" cy="13" r="6" fill="rgba(7,7,10,0.75)"></circle><circle cx="17" cy="34" r="13" fill="rgba(7,7,10,0.75)"></circle></svg>
						<svg class="avatar" viewBox="0 0 34 34"><rect width="34" height="34" fill="#ccccff"></rect><circle cx="17" cy="13" r="6" fill="rgba(7,7,10,0.75)"></circle><circle cx="17" cy="34" r="13" fill="rgba(7,7,10,0.75)"></circle></svg>
					</div>
					<p class="social-proof-text">Trusted by 210k+ stores worldwide</p>
				</div>
			</div>
		</section>
	</main>

	<script>
		(function () {
			var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
			var video = document.querySelector('.hero-bg');

			if (video) {
				if (reduceMotion) {
					video.removeAttribute('autoplay');
					video.pause();
				} else {
					var playPromise = video.play();
					if (playPromise && typeof playPromise.catch === 'function') {
						playPromise.catch(function () {});
					}
				}
			}

			var toggle = document.getElementById('navToggle');
			var menu = document.getElementById('mobileMenu');

			if (toggle && menu) {
				toggle.addEventListener('click', function () {
					var isOpen = menu.classList.toggle('open');
					toggle.classList.toggle('open', isOpen);
					toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
				});

				menu.querySelectorAll('a').forEach(function (link) {
					link.addEventListener('click', function () {
						menu.classList.remove('open');
						toggle.classList.remove('open');
						toggle.setAttribute('aria-expanded', 'false');
					});
				});

				document.addEventListener('keydown', function (event) {
					if (event.key === 'Escape' && menu.classList.contains('open')) {
						menu.classList.remove('open');
						toggle.classList.remove('open');
						toggle.setAttribute('aria-expanded', 'false');
						toggle.focus();
					}
				});
			}
		})();
	</script>
</body>
</html>
