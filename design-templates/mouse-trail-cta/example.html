<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Partner with us — Mouse Trail CTA</title>
<meta name="description" content="A large rounded white CTA card with a giant serif heading and an interactive mouse-trail effect that drops fading, rotated project thumbnails wherever the cursor moves." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23051A24'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23F6FCFF' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E" />
<style>
  @font-face {
    font-family: 'General Sans';
    src: url('assets/GeneralSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'General Sans';
    src: url('assets/GeneralSans-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Instrument Serif';
    src: url('assets/InstrumentSerif-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  /* Palette (spec-QA round-4 correction): the reference reads as two flat
     NEUTRAL greys sitting almost flush — the panel is legible mainly via its
     soft shadow and rounded corners, not a value/tint jump. No warm cast. */
  :root {
    --ink: #051A24;
    --ink-2: #0D212C;
    --paper: #E9E9E9;
    --mute: #E0EBF0;
    --page-bg: #EBEBEB;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 0;
  }

  .partner {
    width: 100%;
    padding: 0.75rem 1rem;
  }

  .partner-card {
    position: relative;
    overflow: hidden;
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding-top: 8.75rem;
    padding-bottom: 7rem;
    background: var(--paper);
    border-radius: 40px;
    box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.05), 0 4px 30px rgba(0, 0, 0, 0.08);
  }

  /* Card padding scales with the same breakpoint ladder as the heading
     (§2/§4 of the spec sheet): compact below md so the card reads as a
     contained card against the page background, "generous" (py-48/192px,
     the prompt-stated value) only from lg up where the reference has real
     desktop room to spend it. Base-tier top/bottom padding is intentionally
     asymmetric (spec-QA round-4 correction): pixel measurement against the
     locked 640×506 reference frame places the headline ink ~28px lower than
     an even 7rem/7rem split produces, while the CTA pill position already
     matches — see KNOWN_DELTAS. */
  @media (min-width: 768px) {
    .partner-card { padding: 9rem 0; }
  }

  @media (min-width: 1024px) {
    .partner-card { padding: 12rem 0; }
  }

  .trail-demo-trigger {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    cursor: pointer;
    z-index: 20;
  }

  .trail-demo-trigger:focus-visible {
    position: absolute;
    top: 1rem;
    left: 1rem;
    width: auto;
    height: auto;
    margin: 0;
    padding: 0.6rem 1.1rem;
    overflow: visible;
    clip: auto;
    white-space: normal;
    background: var(--paper);
    color: var(--ink);
    border-radius: 9999px;
    box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.05), 0 4px 30px rgba(0, 0, 0, 0.08);
    outline: 3px solid var(--ink);
    outline-offset: 3px;
    font-size: 0.8125rem;
    font-weight: 500;
  }

  .partner-content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 1.5rem;
    pointer-events: none;
  }

  .partner-heading {
    /* Base-tier gap to the CTA button is intentionally tighter than the
       desktop 3rem (spec-QA round-4 correction, see .partner-card comment
       above): matches the reference's headline-to-button spacing at the
       640×506 compared frame. */
    margin: 0 0 1.75rem;
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 48px;
    line-height: 1.1;
    letter-spacing: -0.025em;
    color: var(--ink-2);
  }

  @media (min-width: 768px) {
    .partner-heading { font-size: 64px; margin-bottom: 3rem; }
  }

  @media (min-width: 1024px) {
    .partner-heading { font-size: 80px; }
  }

  /* Pill width scales with the same breakpoint ladder as the heading/card
     padding (spec-QA round-4 correction): pixel measurement against the
     locked 640×506 reference frame shows a visibly narrower pill (~185px)
     than the original flat 0.875rem/1.5rem/0.75rem sizing produced
     (~239px, confirmed too wide by the second-family craft critic) — the
     full-size values move to `md` up, where the reference has real
     desktop room to spend them. */
  .partner-cta {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.875rem 1rem;
    max-width: 100%;
    background: var(--ink);
    color: #fff;
    border: 0;
    border-radius: 9999px;
    font-family: 'General Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    pointer-events: auto;
    box-shadow:
      0 1px 2px 0 rgba(5, 26, 36, 0.1),
      0 4px 4px 0 rgba(5, 26, 36, 0.08),
      0 8px 6px 0 rgba(5, 26, 36, 0.04),
      inset 0 2px 6px 0 rgba(255, 255, 255, 0.35);
    transition: background-color 200ms;
  }

  @media (min-width: 768px) {
    .partner-cta { gap: 0.75rem; padding: 0.875rem 1.5rem; font-size: 0.875rem; }
  }

  .partner-cta:hover { background: var(--ink-2); }

  .partner-cta:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }

  .partner-cta[aria-disabled="true"] { cursor: default; }

  /* Narrow-phone safety: the avatar + full label can outgrow a ~320-375px
     card interior; tighten before it clips against partner-card's
     overflow:hidden. */
  @media (max-width: 380px) {
    .partner-cta {
      padding: 0.75rem 0.875rem;
      gap: 0.375rem;
      font-size: 0.6875rem;
    }
  }

  /* The reference frame (640, 1:1) measures the avatar at ~33px; the 40px
     size belongs to the md-and-up tiers like the rest of the scale ladder. */
  .partner-avatar {
    width: 33px;
    height: 33px;
    border-radius: 50%;
    object-fit: cover;
    flex: none;
    /* The reference avatar is a dark-toned photo that recedes into the pill;
       the substitute photo is bright, so pull it down to blend the same way. */
    filter: brightness(0.72) saturate(0.9);
  }

  @media (min-width: 768px) {
    .partner-avatar { width: 40px; height: 40px; }
  }

  .partner-status {
    position: relative;
    z-index: 10;
    min-height: 1.25rem;
    margin-top: 1rem;
    font-size: 0.8125rem;
    color: var(--ink-2);
    opacity: 0;
    transition: opacity 200ms;
    pointer-events: none;
  }

  .partner-status.is-visible { opacity: 1; }

  .trail-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  /* Card width scales with the same breakpoint ladder as the heading/padding
     (spec-QA round-4 correction): the reference frame is 640 CSS px wide and
     shows ~65px-wide cards, not the 96px (`w-24`) size — that size applies
     from `md` up, where the reference has real desktop room to spend it. */
  .trail-thumb-wrap {
    position: absolute;
    width: 65px;
    will-change: transform, opacity;
  }

  @media (min-width: 768px) {
    .trail-thumb-wrap { width: 96px; }
  }

  /* The reference draws every thumbnail as a landscape card (~65x48 at the
     640 frame) even though the source images vary in intrinsic aspect - the
     box is fixed and the artwork covers it. */
  .trail-thumb-wrap img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  }

  /* Reduced-motion resting state: the live pointer trail never spawns anything
     when motion is reduced (mousemove/touchmove listeners aren't attached at
     all, see script below), so a reduced-motion viewer would otherwise see an
     empty card forever. This fixed, non-animating fan of the same trail-card
     assets stands in for that missing motion — a snapshot of the effect
     rather than the effect itself. Hidden for standard motion, where the
     trail stays purely pointer-triggered per spec. */
  .trail-static-set { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .trail-static-set { display: block; }
  }

  .animate-fade-in-up {
    animation: fadeInUp 0.8s ease-out forwards;
    opacity: 0;
  }

  .opacity-0 { opacity: 0; }

  @keyframes fadeInUp {
    0%   { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .animate-fade-in-up {
      animation-duration: 0.01ms;
      animation-iteration-count: 1;
    }
    .partner-cta,
    .partner-status {
      transition-duration: 0.01ms;
    }
  }
</style>
<noscript><style>.opacity-0 { opacity: 1 !important; }</style></noscript>
</head>
<body>
<main class="page">
  <section class="partner" id="partnerSection" aria-labelledby="partnerHeading">
    <div class="partner-card" id="partnerCard">
      <button type="button" class="trail-demo-trigger" id="trailDemoTrigger">
        Preview the hover-trail effect (project thumbnails animate across the card)
      </button>

      <div class="partner-content">
        <h2 class="partner-heading opacity-0" id="partnerHeading">Partner with us</h2>
        <button type="button" class="partner-cta opacity-0" id="ctaButton">
          <img class="partner-avatar" src="assets/avatar.jpg" alt="" />
          <span>Start chat with Viktor</span>
        </button>
        <p class="partner-status" id="ctaStatus" role="status" aria-live="polite"></p>
      </div>

      <div class="trail-layer" id="trailLayer">
        <div class="trail-static-set">
          <div class="trail-thumb-wrap" style="left:26%;top:15%;transform:rotate(-8deg);">
            <img src="assets/trail-card-02-floral-meadow.png" alt="" />
          </div>
          <div class="trail-thumb-wrap" style="left:43%;top:15%;transform:rotate(6deg);">
            <img src="assets/trail-card-03-radar-dashboard.png" alt="" />
          </div>
          <div class="trail-thumb-wrap" style="left:57%;top:18%;transform:rotate(-5deg);">
            <img src="assets/trail-card-06-wealth-gold-dots.png" alt="" />
          </div>
          <div class="trail-thumb-wrap" style="left:66%;top:30%;transform:rotate(8deg);">
            <img src="assets/trail-card-04-golden-hills.png" alt="" />
          </div>
          <div class="trail-thumb-wrap" style="left:12%;top:41%;transform:rotate(-6deg);opacity:0.14;">
            <img src="assets/trail-card-01-form-mockup.png" alt="" />
          </div>
          <div class="trail-thumb-wrap" style="left:26%;top:53%;transform:rotate(-8deg);opacity:0.55;">
            <img src="assets/trail-card-07-golden-hour-desk.png" alt="" />
          </div>
          <div class="trail-thumb-wrap" style="left:46%;top:60%;transform:rotate(-7deg);">
            <img src="assets/trail-card-05-green-valley.png" alt="" />
          </div>
          <div class="trail-thumb-wrap" style="left:62%;top:46%;transform:rotate(6deg);">
            <img src="assets/trail-card-04-golden-hills.png" alt="" />
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
try {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var section = document.getElementById('partnerSection');
  var heading = document.getElementById('partnerHeading');
  var cta = document.getElementById('ctaButton');
  var card = document.getElementById('partnerCard');
  var trailLayer = document.getElementById('trailLayer');
  var demoTrigger = document.getElementById('trailDemoTrigger');
  var ctaStatus = document.getElementById('ctaStatus');

  /* ---- Scroll reveal (ports useInViewAnimation: IntersectionObserver, threshold 0.1, sticky once true) ---- */
  function revealIn() {
    heading.classList.remove('opacity-0');
    heading.classList.add('animate-fade-in-up');
    heading.style.animationDelay = reduceMotion ? '0s' : '0.1s';
    cta.classList.remove('opacity-0');
    cta.classList.add('animate-fade-in-up');
    cta.style.animationDelay = reduceMotion ? '0s' : '0.2s';
  }

  var revealed = false;
  function revealInOnce() {
    if (revealed) return;
    revealed = true;
    revealIn();
  }

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      if (entries[0] && entries[0].isIntersecting) {
        revealInOnce();
        io.disconnect();
      }
    }, { threshold: 0.1 });
    io.observe(section);
    /* Fail-safe: if the observer never reports an intersection (engine
       quirk, zero-height ancestor during setup, etc.), don't leave the
       heading/CTA permanently at opacity 0 — force the reveal after a
       short grace period. */
    setTimeout(revealInOnce, 2000);
  } else {
    revealInOnce();
  }

  /* ---- Mouse-trail CTA: exact port of the prompt's spawn/fade math ---- */
  var IMAGES = [
    'assets/trail-card-01-form-mockup.png',
    'assets/trail-card-02-floral-meadow.png',
    'assets/trail-card-03-radar-dashboard.png',
    'assets/trail-card-04-golden-hills.png',
    'assets/trail-card-05-green-valley.png',
    'assets/trail-card-06-wealth-gold-dots.png',
    'assets/trail-card-07-golden-hour-desk.png'
  ];

  var SPAWN_INTERVAL_MS = 80;   // throttle: ignore spawns closer together than this
  var CLEANUP_INTERVAL_MS = 50; // sweep cadence that removes expired trail items
  var TRAIL_LIFETIME_MS = 1000; // age at which an item is fully faded and removed

  var trailImages = []; // { id, x, y, timestamp, src, rotation, el }
  var isHovered = false;
  var lastSpawnTime = 0;
  var imageIdCounter = 0;
  var rafId = null;

  function spawnTrailImage(x, y, force) {
    var now = Date.now();
    if (!force && now - lastSpawnTime < SPAWN_INTERVAL_MS) return;
    lastSpawnTime = now;

    var src = IMAGES[Math.floor(Math.random() * IMAGES.length)];
    var rotation = (Math.random() - 0.5) * 20; // -10deg .. +10deg
    var id = imageIdCounter++;

    var wrap = document.createElement('div');
    wrap.className = 'trail-thumb-wrap';
    /* Set the spawn position/scale/opacity synchronously, before the first
       paint, instead of waiting for the next tick() rAF pass — otherwise
       the browser can paint one frame of the wrap at its unstyled
       top-left (0,0) resting position before it jumps to the cursor. */
    wrap.style.left = (x - 50) + 'px';
    wrap.style.top = (y - 50) + 'px';
    wrap.style.opacity = '1';
    wrap.style.transform = 'scale(1) rotate(' + rotation + 'deg)';
    var img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.loading = 'lazy';
    wrap.appendChild(img);
    trailLayer.appendChild(wrap);

    trailImages.push({ id: id, x: x, y: y, timestamp: now, src: src, rotation: rotation, el: wrap });

    if (rafId === null) rafId = requestAnimationFrame(tick);
  }

  function tick() {
    var now = Date.now();
    for (var i = 0; i < trailImages.length; i++) {
      var t = trailImages[i];
      var age = now - t.timestamp;
      var progress = Math.min(age / TRAIL_LIFETIME_MS, 1);
      var opacity = 1 - progress;
      var scale = 1 - progress * 0.15;
      t.el.style.left = (t.x - 50) + 'px';
      t.el.style.top = (t.y - 50) + 'px';
      t.el.style.opacity = String(opacity);
      t.el.style.transform = 'scale(' + scale + ') rotate(' + t.rotation + 'deg)';
    }
    rafId = trailImages.length > 0 ? requestAnimationFrame(tick) : null;
  }

  setInterval(function () {
    var now = Date.now();
    var kept = [];
    for (var i = 0; i < trailImages.length; i++) {
      var t = trailImages[i];
      if (now - t.timestamp > TRAIL_LIFETIME_MS) {
        t.el.remove();
      } else {
        kept.push(t);
      }
    }
    trailImages = kept;
  }, CLEANUP_INTERVAL_MS);

  function pointFromEvent(clientX, clientY) {
    var rect = card.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  if (!reduceMotion) {
    card.addEventListener('mouseenter', function () { isHovered = true; });
    card.addEventListener('mouseleave', function () { isHovered = false; });
    card.addEventListener('mousemove', function (e) {
      if (!isHovered) return;
      var p = pointFromEvent(e.clientX, e.clientY);
      spawnTrailImage(p.x, p.y);
    });

    /* Touch path: dragging a finger across the card is the touch equivalent
       of hovering with a mouse — same spawn function, same throttle. */
    card.addEventListener('touchmove', function (e) {
      var touch = e.touches[0];
      if (!touch) return;
      var p = pointFromEvent(touch.clientX, touch.clientY);
      spawnTrailImage(p.x, p.y);
    }, { passive: true });

    /* Keyboard path: a visually-hidden control (visible on focus) plays the
       same trail as a preset arc, so a non-pointer user reaches the same
       decorative content the hover effect reveals. */
    demoTrigger.addEventListener('click', function () {
      var rect = card.getBoundingClientRect();
      var cx = rect.width / 2;
      var cy = rect.height / 2;
      var steps = 6;
      for (var i = 0; i < steps; i++) {
        (function (i) {
          setTimeout(function () {
            var angle = (i / steps) * Math.PI * 2;
            var radius = Math.min(rect.width, rect.height) * 0.22;
            spawnTrailImage(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius, true);
          }, i * SPAWN_INTERVAL_MS);
        })(i);
      }
    });
  } else {
    /* Fully still reduced-motion state: no pointer, touch, or keyboard path
       spawns the decorative trail; the hidden trigger is removed from the
       tab order instead of being left as a dead control. */
    demoTrigger.disabled = true;
  }

  /* ---- CTA click feedback (no live endpoint; inline status only) ----
     aria-disabled (not the disabled attribute) guards against double-
     sends: a natively disabled button is pulled out of the tab order and
     drops focus back to <body>, losing the keyboard user's place right
     after they activated it. aria-disabled keeps it focusable and just
     ignores repeat clicks. */
  var ctaTimer = null;
  var ctaSending = false;
  cta.addEventListener('click', function () {
    if (ctaSending) return;
    ctaSending = true;
    ctaStatus.textContent = 'Chat request sent — Viktor will reply shortly.';
    ctaStatus.classList.add('is-visible');
    cta.setAttribute('aria-disabled', 'true');
    clearTimeout(ctaTimer);
    ctaTimer = setTimeout(function () {
      ctaSending = false;
      cta.removeAttribute('aria-disabled');
      ctaStatus.classList.remove('is-visible');
      ctaStatus.textContent = '';
    }, 2600);
  });
} catch (err) {
  /* Fail-safe: a script error anywhere above must not leave the heading/
     CTA permanently at opacity 0 (see the noscript rule in <head> for the
     no-JS case; this covers the JS-present-but-broken case). */
  var stuck = document.querySelectorAll('.opacity-0');
  for (var i = 0; i < stuck.length; i++) {
    stuck[i].classList.remove('opacity-0');
    stuck[i].style.opacity = '1';
  }
}
})();
</script>
</body>
</html>
