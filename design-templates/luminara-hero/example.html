<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Luminara — Creative Showcase</title>
	<meta
		name="description"
		content="Luminara hero section: a full-viewport looping forest video, pill-shaped glass navigation, and a headline that turns ordinary ideas into captivating narratives."
	>
	<link
		rel="icon"
		href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2305070d'/%3E%3Cpath d='M16 6 L18.3 13.7 L26 16 L18.3 18.3 L16 26 L13.7 18.3 L6 16 L13.7 13.7 Z' fill='%23a78bfa'/%3E%3Ccircle cx='23.5' cy='8.5' r='2' fill='%235eead4'/%3E%3C/svg%3E"
	>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
		rel="stylesheet"
	>
	<style>
		:root {
			--bg: #05070d;
			--fg: #f6f5ff;
			--fg-soft: rgba(246, 245, 255, 0.84);
			--fg-muted: rgba(246, 245, 255, 0.6);
			--pill-bg: rgba(6, 8, 16, 0.42);
			--pill-border: rgba(255, 255, 255, 0.12);
			--accent: #a78bfa;
			--accent-2: #5eead4;
			--accent-soft: rgba(167, 139, 250, 0.35);
			--ease-out: cubic-bezier(0.23, 1, 0.32, 1);
		}

		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			padding: 0;
			background: var(--bg);
		}

		body {
			font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			color: var(--fg);
		}

		a, button {
			font-family: inherit;
			color: inherit;
		}

		/* ---------- Hero shell ---------- */

		.hero {
			position: relative;
			width: 100%;
			height: 100vh;
			height: 100svh;
			min-height: 560px;
			overflow: hidden;
			background: var(--bg);
			isolation: isolate;
		}

		.hero-parallax {
			position: absolute;
			inset: -16px;
			will-change: transform;
		}

		.hero-zoom {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			transform-origin: center center;
			animation: heroKenBurns 26s var(--ease-out) infinite alternate;
		}

		.hero-poster {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			background-image: url('assets/luminara-poster.jpg');
			background-size: cover;
			background-position: center;
		}

		.hero-video {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
		}

		@keyframes heroKenBurns {
			from {
				transform: scale(1);
			}
			to {
				transform: scale(1.07);
			}
		}

		/* ---------- Ambient light motes ---------- */

		.hero-particles {
			position: absolute;
			inset: 0;
			z-index: 2;
			overflow: hidden;
			pointer-events: none;
		}

		.particle {
			position: absolute;
			bottom: -6%;
			border-radius: 50%;
			opacity: 0;
			filter: blur(0.3px);
			animation: particleFloat linear infinite;
		}

		.particle:nth-child(1) { left: 6%;  width: 5px; height: 5px; animation-duration: 15s; animation-delay: 0s;    background: radial-gradient(circle, var(--accent-2) 0%, rgba(94, 234, 212, 0) 72%); }
		.particle:nth-child(2) { left: 17%; width: 3px; height: 3px; animation-duration: 12s; animation-delay: 2.2s;  background: radial-gradient(circle, var(--accent) 0%, rgba(167, 139, 250, 0) 72%); }
		.particle:nth-child(3) { left: 32%; width: 4px; height: 4px; animation-duration: 18s; animation-delay: 4.6s;  background: radial-gradient(circle, var(--accent-2) 0%, rgba(94, 234, 212, 0) 72%); }
		.particle:nth-child(4) { left: 48%; width: 6px; height: 6px; animation-duration: 20s; animation-delay: 1.2s;  background: radial-gradient(circle, var(--accent) 0%, rgba(167, 139, 250, 0) 72%); }
		.particle:nth-child(5) { left: 63%; width: 3px; height: 3px; animation-duration: 13s; animation-delay: 6.4s;  background: radial-gradient(circle, var(--accent-2) 0%, rgba(94, 234, 212, 0) 72%); }
		.particle:nth-child(6) { left: 78%; width: 5px; height: 5px; animation-duration: 17s; animation-delay: 3.1s;  background: radial-gradient(circle, var(--accent) 0%, rgba(167, 139, 250, 0) 72%); }
		.particle:nth-child(7) { left: 90%; width: 4px; height: 4px; animation-duration: 14s; animation-delay: 8.3s;  background: radial-gradient(circle, var(--accent-2) 0%, rgba(94, 234, 212, 0) 72%); }

		@keyframes particleFloat {
			0% {
				transform: translateY(0) scale(0.5);
				opacity: 0;
			}
			12% {
				opacity: 0.85;
			}
			85% {
				opacity: 0.3;
			}
			100% {
				transform: translateY(-88vh) scale(1);
				opacity: 0;
			}
		}

		/* ---------- Bottom contrast gradient ---------- */

		.bottom-gradient {
			position: absolute;
			left: 0;
			right: 0;
			bottom: 0;
			height: 60%;
			z-index: 5;
			pointer-events: none;
			background: linear-gradient(to top, rgba(0, 0, 0, 0.82) 0%, rgba(0, 0, 0, 0.4) 55%, rgba(0, 0, 0, 0) 100%);
		}

		/* ---------- Nav ---------- */

		.site-header {
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			z-index: 10;
			padding: 1rem;
		}

		.nav-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.75rem;
		}

		.pill {
			display: flex;
			align-items: center;
			background: var(--pill-bg);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			border: 1px solid var(--pill-border);
			border-radius: 999px;
			opacity: 0;
			transform: translateY(-14px);
			animation: heroFadeDown 700ms var(--ease-out) forwards;
			animation-delay: 0.1s;
		}

		.pill-left {
			gap: 1.5rem;
			padding: 0.5rem 0.75rem 0.5rem 1rem;
		}

		.pill-right {
			gap: 0.25rem;
			padding: 0.375rem;
		}

		.logo {
			display: flex;
			align-items: center;
			line-height: 0;
		}

		.logo svg {
			display: block;
			width: 20px;
			height: 20px;
		}

		.nav-links {
			display: none;
			align-items: center;
			gap: 1.5rem;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.nav-links a {
			text-decoration: none;
			font-size: 0.875rem;
			font-weight: 500;
			color: var(--fg);
			opacity: 0.92;
			transition: opacity 200ms var(--ease-out);
		}

		.nav-links a:hover {
			opacity: 1;
			color: var(--fg-soft);
		}

		.btn-ghost,
		.btn-solid {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			text-decoration: none;
			font-size: 0.8125rem;
			font-weight: 500;
			border-radius: 999px;
			padding: 0.55rem 1rem;
			transition: background 200ms var(--ease-out), color 200ms var(--ease-out), transform 200ms var(--ease-out);
			white-space: nowrap;
		}

		.btn-ghost {
			color: var(--fg);
			background: transparent;
		}

		.btn-ghost:hover {
			background: rgba(255, 255, 255, 0.1);
		}

		.btn-solid {
			position: relative;
			color: #0b0b12;
			background: #ffffff;
			isolation: isolate;
		}

		.btn-solid::before {
			content: "";
			position: absolute;
			inset: -10px;
			z-index: -1;
			border-radius: 999px;
			background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
			opacity: 0;
			filter: blur(10px);
			transition: opacity 300ms var(--ease-out);
			pointer-events: none;
		}

		.btn-solid:hover {
			background: rgba(255, 255, 255, 0.9);
			transform: translateY(-1px);
		}

		.btn-solid:hover::before {
			opacity: 1;
		}

		/* ---------- Bottom content ---------- */

		.hero-content {
			position: absolute;
			left: 0;
			right: 0;
			bottom: 0;
			z-index: 10;
			padding: 1rem 1rem 2rem;
			display: flex;
			flex-direction: column;
			gap: 1.5rem;
		}

		.hero-left {
			max-width: 46rem;
		}

		.hero-badge {
			display: inline-flex;
			align-items: center;
			gap: 0.4rem;
			margin: 0 0 1rem;
			padding: 0.35rem 0.9rem;
			background: var(--pill-bg);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			border: 1px solid var(--pill-border);
			border-radius: 999px;
			font-size: 0.75rem;
			font-weight: 500;
			color: var(--fg);
			box-shadow: 0 0 0 0 var(--accent-soft);
			animation: heroFadeUp 700ms var(--ease-out) forwards, badgeGlow 4400ms ease-in-out infinite;
			animation-delay: 0.2s, 1.1s;
			opacity: 0;
		}

		.badge-sep {
			color: var(--fg-muted);
		}

		@keyframes badgeGlow {
			0%, 100% {
				box-shadow: 0 0 0 0 rgba(167, 139, 250, 0);
			}
			50% {
				box-shadow: 0 0 18px 1px var(--accent-soft);
			}
		}

		.hero-heading {
			margin: 0;
			font-size: clamp(1.9rem, 1.15rem + 3.6vw, 4.25rem);
			font-weight: 500;
			line-height: 1.05;
			letter-spacing: -0.02em;
			color: var(--fg);
			opacity: 0;
			animation: heroFadeUp 800ms var(--ease-out) forwards;
			animation-delay: 0.35s;
		}

		.heading-accent {
			font-family: 'Instrument Serif', Georgia, serif;
			font-style: italic;
			font-weight: 400;
			color: var(--accent);
		}

		@supports (background-clip: text) or (-webkit-background-clip: text) {
			.heading-accent {
				background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
				color: transparent;
			}
		}

		.hero-right {
			opacity: 0;
			animation: heroFadeUp 800ms var(--ease-out) forwards;
			animation-delay: 0.5s;
		}

		.hero-desc {
			margin: 0;
			font-size: clamp(0.875rem, 0.8rem + 0.3vw, 1rem);
			line-height: 1.65;
			color: var(--fg-soft);
		}

		@keyframes heroFadeUp {
			from {
				opacity: 0;
				transform: translateY(26px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@keyframes heroFadeDown {
			from {
				opacity: 0;
				transform: translateY(-14px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		/* ---------- Breakpoints ---------- */

		@media (min-width: 640px) {
			.site-header {
				padding: 1.5rem;
			}

			.nav-links {
				display: flex;
			}

			.hero-content {
				padding: 1.5rem 1.5rem 3rem;
			}
		}

		@media (min-width: 768px) {
			.site-header {
				padding: 1.75rem 2rem;
			}

			.hero-content {
				padding: 1.75rem 2rem 3.5rem;
			}
		}

		@media (min-width: 1024px) {
			.site-header {
				padding: 2rem 2.5rem;
			}

			.hero-content {
				flex-direction: row;
				align-items: flex-end;
				justify-content: space-between;
				gap: 3rem;
				padding: 2rem 2.5rem 4rem;
			}

			.hero-right {
				max-width: 24rem;
				text-align: right;
			}
		}

		/* ---------- Reduced motion ---------- */

		@media (prefers-reduced-motion: reduce) {
			.hero-video {
				display: none;
			}

			.hero-zoom {
				animation: none;
				transform: none;
			}

			.particle {
				display: none;
			}

			.pill,
			.hero-badge,
			.hero-heading,
			.hero-right {
				animation: none !important;
				opacity: 1 !important;
				transform: none !important;
				box-shadow: none !important;
			}

			.btn-ghost,
			.btn-solid,
			.nav-links a,
			.btn-solid::before {
				transition: none;
			}
		}
	</style>
</head>
<body>
	<section class="hero" aria-label="Luminara introduction">
		<div class="hero-parallax" id="hero-parallax">
			<div class="hero-zoom">
				<div class="hero-poster" aria-hidden="true"></div>
				<video
					class="hero-video"
					autoplay
					muted
					loop
					playsinline
					preload="auto"
					poster="assets/luminara-poster.jpg"
					aria-hidden="true"
				>
					<source src="assets/luminara-forest-bg.mp4" type="video/mp4">
				</video>
			</div>
		</div>

		<div class="hero-particles" aria-hidden="true">
			<span class="particle"></span>
			<span class="particle"></span>
			<span class="particle"></span>
			<span class="particle"></span>
			<span class="particle"></span>
			<span class="particle"></span>
			<span class="particle"></span>
		</div>

		<div class="bottom-gradient" aria-hidden="true"></div>

		<header class="site-header">
			<nav class="nav-row" aria-label="Primary">
				<div class="pill pill-left">
					<a class="logo" href="#" aria-label="Luminara home">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" aria-hidden="true">
							<path d="M 256 192 C 256 227.346 227.346 256 192 256 L 0 256 L 0 64 C 0 28.654 28.654 0 64 0 L 256 0 Z M 128 192 L 192 192 L 192 128 L 128 128 L 128 64 L 64 64 L 64 128 L 128 128 Z" fill="#ffffff" />
						</svg>
					</a>
					<ul class="nav-links">
						<li><a href="#">Work</a></li>
						<li><a href="#">Gallery</a></li>
						<li><a href="#">Plans</a></li>
						<li><a href="#">Story</a></li>
					</ul>
				</div>

				<div class="pill pill-right">
					<a class="btn-ghost" href="#">Get Free</a>
					<a class="btn-solid" href="#">Get a quote</a>
				</div>
			</nav>
		</header>

		<div class="hero-content">
			<div class="hero-left">
				<p class="hero-badge">
					<span>Luminara</span>
					<span class="badge-sep" aria-hidden="true">*</span>
					<span>Creative Showcase</span>
				</p>
				<h1 class="hero-heading">Make ordinary ideas into captivating <span class="heading-accent">narratives.</span></h1>
			</div>

			<div class="hero-right">
				<p class="hero-desc">Design your ideal online presence, grow your client base while crafting pieces with love and soul.</p>
			</div>
		</div>
	</section>

	<script>
		(function () {
			var hero = document.querySelector('.hero');
			var parallax = document.getElementById('hero-parallax');
			var video = document.querySelector('.hero-video');
			var reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

			var mouse = { x: 0, y: 0 };
			var smooth = { x: 0, y: 0 };
			var rafId = null;
			var maxOffset = 12;

			function onPointerMove(event) {
				var rect = hero.getBoundingClientRect();
				mouse.x = ((event.clientX - rect.left) / rect.width - 0.5) * 2;
				mouse.y = ((event.clientY - rect.top) / rect.height - 0.5) * 2;
			}

			function onPointerLeave() {
				mouse.x = 0;
				mouse.y = 0;
			}

			function tick() {
				smooth.x += (mouse.x - smooth.x) * 0.06;
				smooth.y += (mouse.y - smooth.y) * 0.06;
				var tx = (smooth.x * maxOffset * -1).toFixed(2);
				var ty = (smooth.y * maxOffset * -1).toFixed(2);
				parallax.style.transform = 'translate3d(' + tx + 'px, ' + ty + 'px, 0)';
				rafId = window.requestAnimationFrame(tick);
			}

			function startParallax() {
				hero.addEventListener('pointermove', onPointerMove);
				hero.addEventListener('pointerleave', onPointerLeave);
				if (!rafId) {
					rafId = window.requestAnimationFrame(tick);
				}
			}

			function stopParallax() {
				hero.removeEventListener('pointermove', onPointerMove);
				hero.removeEventListener('pointerleave', onPointerLeave);
				if (rafId) {
					window.cancelAnimationFrame(rafId);
					rafId = null;
				}
				parallax.style.transform = 'none';
			}

			function applyMotionPreference() {
				if (reduceMotionQuery.matches) {
					stopParallax();
					if (video) {
						try { video.pause(); } catch (e) {}
					}
				} else {
					startParallax();
					if (video) {
						var playPromise = video.play();
						if (playPromise && playPromise.catch) {
							playPromise.catch(function () {});
						}
					}
				}
			}

			applyMotionPreference();
			if (reduceMotionQuery.addEventListener) {
				reduceMotionQuery.addEventListener('change', applyMotionPreference);
			} else if (reduceMotionQuery.addListener) {
				reduceMotionQuery.addListener(applyMotionPreference);
			}
		})();
	</script>
</body>
</html>
