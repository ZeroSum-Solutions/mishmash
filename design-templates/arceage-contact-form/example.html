<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arceage Contact Us</title>
<meta name="description" content="Contact form section for Arceage — get in touch about precision harvesting services." />


<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* ---------- Tokens ---------- */
  :root {
    --font-sans: "Barlow", ui-sans-serif, system-ui, sans-serif;
    --font-dm-serif: "Instrument Serif", serif;

    --color-black: #000000;
    --color-white: #ffffff;
    --color-subtitle: #1f2937; /* gray-800 */
    --color-placeholder: #D9D9D9;
    --color-placeholder-focus: #6b7280; /* gray-500 */
    --color-border: #D9D9D9;

    /* Chromatic tokens — real, parseable colors. These are the design's own
       interaction colors (valid/invalid form feedback + button hover), not
       decoration. They never render at rest: only after a field is touched,
       on button hover, or on keyboard focus (the focus ring below reuses
       --valid-green). */
    --valid-green: #27BD09;
    --invalid-red: #FF1F1F;
    --focus-ring: #27BD09;
  }

  /* ---------- Reset ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--color-black);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  img, svg { display: block; max-width: 100%; }
  button { font-family: inherit; border: none; cursor: pointer; }
  input { font-family: inherit; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- Page chrome ---------- */
  /* The prompt's stated global "page wrapper" is bg-black text-white; this
     section explicitly overrides to bg-white text-black. On its own page,
     that dark wrapper becomes the minimal chrome around the section. */
  .page-chrome {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 0;
  }

  /* ---------- Section ---------- */
  #contact {
    width: 100%;
    background: var(--color-white);
    color: var(--color-black);
    padding: 96px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  @media (min-width: 768px) {
    #contact { padding-left: 48px; padding-right: 48px; }
  }
  @media (min-width: 1024px) {
    #contact { padding-left: 120px; padding-right: 120px; }
  }

  .reveal-wrap {
    width: 100%;
    max-width: 48rem; /* max-w-3xl */
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Header ---------- */
  .contact-header {
    text-align: center;
    margin-bottom: 4rem; /* mb-16 */
    width: 100%;
  }

  .contact-heading {
    font-size: clamp(1.5rem, 4vw, 3.5rem);
    font-weight: 500;
    letter-spacing: -0.025em;
    margin: 0 0 1.5rem 0; /* mb-6 */
    line-height: 1.1;
  }
  .contact-heading .accent {
    font-family: var(--font-dm-serif);
    font-weight: 400;
    font-style: italic;
  }

  .contact-subtitle {
    margin: 0;
    font-size: 1.125rem;   /* text-lg */
    line-height: 1.75rem;
    color: var(--color-subtitle);
  }
  @media (min-width: 768px) {
    .contact-subtitle { font-size: 1.25rem; } /* md:text-xl */
  }

  /* Typewriter characters: opacity-only reveal, staggered via inline
     transition-delay computed from the same speed/delay constants as the
     original motion/react component. */
  .tw-char {
    opacity: 0;
    transition: opacity 0.2s linear;
  }
  .tw-char.tw-visible { opacity: 1; }

  /* ---------- Form ---------- */
  #contact-form {
    max-width: 42rem; /* max-w-2xl */
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 2rem; /* gap-8 */
  }
  /* Higher specificity than the plain #contact-form rule above (same ID plus
     an attribute selector), so the "hidden" attribute set after a successful
     submit actually hides it instead of losing to display: flex. */
  #contact-form[hidden] {
    display: none;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.5rem; /* gap-2 */
    border-bottom: 1px solid var(--color-border);
    padding-bottom: 0.5rem; /* pb-2 */
    transition: border-color 0.3s;

    opacity: 0;
    transform: translateY(20px);
    transition: border-color 0.3s, opacity 0.6s ease-out, transform 0.6s ease-out;
  }
  .field:hover { border-color: var(--color-black); }
  .field:focus-within { border-color: var(--color-black); }
  .field.field-visible { opacity: 1; transform: translateY(0); }

  .field label {
    font-size: 0.875rem; /* text-sm */
    line-height: 1.25rem;
    font-weight: 500;
  }

  .field-input-wrap { position: relative; width: 100%; }

  .field input {
    width: 100%;
    background: transparent;
    outline: none;
    border: none;
    padding: 0;
    color: inherit;
    font-size: 1rem; /* text-base */
    line-height: 1.5rem;
    padding-right: 2rem; /* pr-8, room for the icon */
    transition: color 0.3s;
  }
  .field input::placeholder { color: var(--color-placeholder); transition: color 0.3s; }
  .field input:focus::placeholder { color: var(--color-placeholder-focus); }

  .field-icon {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 1.25rem; /* w-5 */
    height: 1.25rem; /* h-5 */
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    display: none;
  }
  .field-icon.icon-valid {
    display: block;
    background-color: var(--valid-green);
    -webkit-mask-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTEyIDJDNi40OSAyIDIgNi40OSAyIDEyQzIgMTcuNTEgNi40OSAyMiAxMiAyMkMxNy41MSAyMiAyMiAxNy41MSAyMiAxMkMyMiA2LjQ5IDE3LjUxIDIgMTIgMlpNMTYuNzggOS43TDExLjExIDE1LjM3QzEwLjk3IDE1LjUxIDEwLjc4IDE1LjU5IDEwLjU4IDE1LjU5QzEwLjM4IDE1LjU5IDEwLjE5IDE1LjUxIDEwLjA1IDE1LjM3TDcuMjIgMTIuNTRDNi45MyAxMi4yNSA2LjkzIDExLjc3IDcuMjIgMTEuNDhDNy41MSAxMS4xOSA3Ljk5IDExLjE5IDguMjggMTEuNDhMMTAuNTggMTMuNzhMMTUuNzIgOC42NEMxNi4wMSA4LjM1IDE2LjQ5IDguMzUgMTYuNzggOC42NEMxNy4wNyA4LjkzIDE3LjA3IDkuNCAxNi43OCA5LjdaIiBmaWxsPSIjMTcxNzE3Ii8+Cjwvc3ZnPgo=');
    mask-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTEyIDJDNi40OSAyIDIgNi40OSAyIDEyQzIgMTcuNTEgNi40OSAyMiAxMiAyMkMxNy41MSAyMiAyMiAxNy41MSAyMiAxMkMyMiA2LjQ5IDE3LjUxIDIgMTIgMlpNMTYuNzggOS43TDExLjExIDE1LjM3QzEwLjk3IDE1LjUxIDEwLjc4IDE1LjU5IDEwLjU4IDE1LjU5QzEwLjM4IDE1LjU5IDEwLjE5IDE1LjUxIDEwLjA1IDE1LjM3TDcuMjIgMTIuNTRDNi45MyAxMi4yNSA2LjkzIDExLjc3IDcuMjIgMTEuNDhDNy41MSAxMS4xOSA3Ljk5IDExLjE5IDguMjggMTEuNDhMMTAuNTggMTMuNzhMMTUuNzIgOC42NEMxNi4wMSA4LjM1IDE2LjQ5IDguMzUgMTYuNzggOC42NEMxNy4wNyA4LjkzIDE3LjA3IDkuNCAxNi43OCA5LjdaIiBmaWxsPSIjMTcxNzE3Ii8+Cjwvc3ZnPgo=');
  }
  .field-icon.icon-invalid {
    display: block;
    background-color: var(--invalid-red);
    -webkit-mask-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTEyIDJDNi40OSAyIDIgNi40OSAyIDEyQzIgMTcuNTEgNi40OSAyMiAxMiAyMkMxNy41MSAyMiAyMiAxNy41MSAyMiAxMkMyMiA2LjQ5IDE3LjUxIDIgMTIgMlpNMTUuMzYgMTQuM0MxNS42NSAxNC41OSAxNS42NSAxNS4wNyAxNS4zNiAxNS4zNkMxNS4yMSAxNS41MSAxNS4wMiAxNS41OCAxNC44MyAxNS41OEMxNC42NCAxNS41OCAxNC40NSAxNS41MSAxNC4zIDE1LjM2TDEyIDEzLjA2TDkuNyAxNS4zNkM5LjU1IDE1LjUxIDkuMzYgMTUuNTggOS4xNyAxNS41OEM4Ljk4IDE1LjU4IDguNzkgMTUuNTEgOC42NCAxNS4zNkM4LjM1IDE1LjA3IDguMzUgMTQuNTkgOC42NCAxNC4zTDEwLjk0IDEyTDguNjQgOS43QzguMzUgOS40MSA4LjM1IDguOTMgOC42NCA4LjY0QzguOTMgOC4zNSA5LjQxIDguMzUgOS43IDguNjRMMTIgMTAuOTRMMTQuMyA4LjY0QzE0LjU5IDguMzUgMTUuMDcgOC4zNSAxNS4zNiA4LjY0QzE1LjY1IDguOTMgMTUuNjUgOS40MSAxNS4zNiA5LjdMMTMuMDYgMTJMMTUuMzYgMTQuM1oiIGZpbGw9IiMxNzE3MTciLz4KPC9zdmc+Cg==');
  }

  /* ---------- Submit ---------- */
  .submit-wrap {
    margin-top: 2rem; /* mt-8 */
    display: flex;
    justify-content: center;

    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
  }
  .submit-wrap.field-visible { opacity: 1; transform: translateY(0); }

  .submit-btn {
    background: var(--color-black);
    color: var(--color-white);
    padding: 0.625rem 1.5rem; /* py-2.5 px-6 */
    border-radius: 9999px;
    font-size: 0.875rem; /* text-sm */
    letter-spacing: 0.025em; /* tracking-wide */
    transition: background-color 0.3s;
  }
  .submit-btn:hover { background: var(--valid-green); }
  .submit-btn:disabled { cursor: default; }

  /* ---------- Success state ---------- */
  .form-success {
    max-width: 42rem;
    width: 100%;
    margin: 0 auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }
  .form-success[hidden] { display: none; }
  .form-success .success-icon {
    width: 2.5rem;
    height: 2.5rem;
    background-color: var(--valid-green);
    -webkit-mask-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTEyIDJDNi40OSAyIDIgNi40OSAyIDEyQzIgMTcuNTEgNi40OSAyMiAxMiAyMkMxNy41MSAyMiAyMiAxNy41MSAyMiAxMkMyMiA2LjQ5IDE3LjUxIDIgMTIgMlpNMTYuNzggOS43TDExLjExIDE1LjM3QzEwLjk3IDE1LjUxIDEwLjc4IDE1LjU5IDEwLjU4IDE1LjU5QzEwLjM4IDE1LjU5IDEwLjE5IDE1LjUxIDEwLjA1IDE1LjM3TDcuMjIgMTIuNTRDNi45MyAxMi4yNSA2LjkzIDExLjc3IDcuMjIgMTEuNDhDNy41MSAxMS4xOSA3Ljk5IDExLjE5IDguMjggMTEuNDhMMTAuNTggMTMuNzhMMTUuNzIgOC42NEMxNi4wMSA4LjM1IDE2LjQ5IDguMzUgMTYuNzggOC42NEMxNy4wNyA4LjkzIDE3LjA3IDkuNCAxNi43OCA5LjdaIiBmaWxsPSIjMTcxNzE3Ii8+Cjwvc3ZnPgo=');
    mask-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTEyIDJDNi40OSAyIDIgNi40OSAyIDEyQzIgMTcuNTEgNi40OSAyMiAxMiAyMkMxNy41MSAyMiAyMiAxNy41MSAyMiAxMkMyMiA2LjQ5IDE3LjUxIDIgMTIgMlpNMTYuNzggOS43TDExLjExIDE1LjM3QzEwLjk3IDE1LjUxIDEwLjc4IDE1LjU5IDEwLjU4IDE1LjU5QzEwLjM4IDE1LjU5IDEwLjE5IDE1LjUxIDEwLjA1IDE1LjM3TDcuMjIgMTIuNTRDNi45MyAxMi4yNSA2LjkzIDExLjc3IDcuMjIgMTEuNDhDNy41MSAxMS4xOSA3Ljk5IDExLjE5IDguMjggMTEuNDhMMTAuNTggMTMuNzhMMTUuNzIgOC42NEMxNi4wMSA4LjM1IDE2LjQ5IDguMzUgMTYuNzggOC42NEMxNy4wNyA4LjkzIDE3LjA3IDkuNCAxNi43OCA5LjdaIiBmaWxsPSIjMTcxNzE3Ii8+Cjwvc3ZnPgo=');
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
  }
  .form-success p {
    margin: 0;
    font-size: 1.125rem;
    line-height: 1.75rem;
    color: var(--color-subtitle);
  }

  /* ---------- Focus visibility (additive, never shown at rest) ---------- */
  .field input:focus-visible {
    outline: none;
  }
  .field:has(input:focus-visible) {
    outline: 2px solid var(--focus-ring);
    outline-offset: 4px;
    border-radius: 2px;
  }
  .submit-btn:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  /* ---------- Reduced motion: dignified static fallback ---------- */
  @media (prefers-reduced-motion: reduce) {
    .tw-char { transition: none; opacity: 1; }
    .field, .submit-wrap {
      transition: none;
      opacity: 1;
      transform: none;
    }
  }
</style>
</head>
<body>
<div class="page-chrome">
<section id="contact">
  <div class="reveal-wrap" id="reveal-wrap">

    <!-- Header -->
    <div class="contact-header">
      <h2 class="contact-heading">
        <span class="accent tw" data-text="Let's grow!" data-delay="0" data-speed="0.012" aria-hidden="true"></span><span class="tw" data-text=" Fill in the form" data-delay="0.2" data-speed="0.012" aria-hidden="true"></span><br />
        <span class="tw" data-text="and we'll be in touch" data-delay="0.4" data-speed="0.012" aria-hidden="true"></span>
        <span class="sr-only">Let's grow! Fill in the form and we'll be in touch</span>
      </h2>
      <p class="contact-subtitle">
        <span class="tw" data-text="Ask us about our precision harvesting services" data-delay="0.6" data-speed="0.012" aria-hidden="true"></span>
        <span class="sr-only">Ask us about our precision harvesting services</span>
      </p>
    </div>
    <!-- Form -->
    <form id="contact-form" novalidate>

      <div class="field" data-field="name" data-required="true">
        <label for="field-name">Your Name*</label>
        <div class="field-input-wrap">
          <input type="text" id="field-name" name="name" required autocomplete="name" placeholder="Who's reaching out?" aria-describedby="err-name" />
          <div class="field-icon" aria-hidden="true"></div>
        </div>
        <span id="err-name" class="sr-only" role="status"></span>
      </div>

      <div class="field" data-field="email" data-required="true">
        <label for="field-email">Email*</label>
        <div class="field-input-wrap">
          <input type="email" id="field-email" name="email" required autocomplete="email" placeholder="Where can we reach you?" aria-describedby="err-email" />
          <div class="field-icon" aria-hidden="true"></div>
        </div>
        <span id="err-email" class="sr-only" role="status"></span>
      </div>

      <div class="field" data-field="phone" data-required="true">
        <label for="field-phone">Phone Number*</label>
        <div class="field-input-wrap">
          <input type="tel" id="field-phone" name="phone" required autocomplete="tel" pattern="^\+[\d\s\-\(\)]{7,20}$" placeholder="Best number to call you on?" aria-describedby="err-phone" />
          <div class="field-icon" aria-hidden="true"></div>
        </div>
        <span id="err-phone" class="sr-only" role="status"></span>
      </div>

      <div class="field" data-field="farm" data-required="false">
        <label for="field-farm">Farm / Company</label>
        <div class="field-input-wrap">
          <input type="text" id="field-farm" name="farm" autocomplete="organization" placeholder="Your farm or organization?" />
          <div class="field-icon" aria-hidden="true"></div>
        </div>
      </div>

      <div class="field" data-field="message" data-required="false">
        <label for="field-message">Tell Us More</label>
        <div class="field-input-wrap">
          <input type="text" id="field-message" name="message" autocomplete="off" placeholder="What crops or acreage would you like to discuss?" />
          <div class="field-icon" aria-hidden="true"></div>
        </div>
      </div>

      <div class="submit-wrap">
        <button type="submit" class="submit-btn">Send Message</button>
      </div>
    </form>

    <div class="form-success" id="form-success" hidden role="status" aria-live="polite">
      <div class="success-icon" aria-hidden="true"></div>
      <p>Thanks — your message is on its way. We'll be in touch shortly.</p>
    </div>
  </div>
</section>
</div>
<script>
(function () {
  'use strict';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Typewriter reveal (ports the Typewriter component's math:
     one span per character, staggerChildren = speed, delayChildren = delay) ---------- */
  function buildTypewriter(el) {
    var text = el.getAttribute('data-text') || '';
    var delay = parseFloat(el.getAttribute('data-delay')) || 0;
    var speed = parseFloat(el.getAttribute('data-speed')) || 0.015;
    var chars = text.split('');
    for (var i = 0; i < chars.length; i++) {
      var span = document.createElement('span');
      span.className = 'tw-char';
      span.textContent = chars[i];
      if (!reduceMotion) {
        span.style.transitionDelay = (delay + i * speed).toFixed(3) + 's';
      }
      el.appendChild(span);
    }
  }

  function revealTypewriters() {
    var nodes = document.querySelectorAll('.tw');
    nodes.forEach(function (el) {
      var chars = el.querySelectorAll('.tw-char');
      for (var i = 0; i < chars.length; i++) {
        chars[i].classList.add('tw-visible');
      }
    });
  }

  document.querySelectorAll('.tw').forEach(buildTypewriter);

  /* ---------- Scroll reveal (ports the outer stagger wrapper: whileInView,
     once: true, margin: -100px, staggerChildren: 0.1 across the 5 fields
     + submit button) ---------- */
  var revealTargets = document.querySelectorAll('#contact-form .field, #contact-form .submit-wrap');

  function playReveal() {
    revealTypewriters();
    revealTargets.forEach(function (el, i) {
      if (reduceMotion) {
        el.classList.add('field-visible');
      } else {
        setTimeout(function () { el.classList.add('field-visible'); }, i * 100);
      }
    });
  }

  var revealWrap = document.getElementById('reveal-wrap');
  if ('IntersectionObserver' in window && !reduceMotion) {
    var io = new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          playReveal();
          obs.disconnect();
        }
      });
    }, { rootMargin: '-100px', threshold: 0 });
    io.observe(revealWrap);
  } else {
    playReveal();
  }

  /* ---------- Validation (ports the prompt's validations object + the
     renderIcon rule verbatim: null until touched; green when valid; red
     only when invalid AND required) ---------- */
  var validators = {
    name: function (v) { return v.trim().length > 0; },
    email: function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); },
    phone: function (v) { return /^\+[\d\s\-\(\)]{7,20}$/.test(v); },
    farm: function (v) { return v.trim().length > 0; },
    message: function (v) { return v.trim().length > 0; }
  };
  var requiredFields = { name: true, email: true, phone: true, farm: false, message: false };
  var touched = { name: false, email: false, phone: false, farm: false, message: false };

  var form = document.getElementById('contact-form');
  var inputs = form.querySelectorAll('input[name]');

  function updateField(name) {
    var input = form.querySelector('input[name="' + name + '"]');
    var wrap = input.closest('.field');
    var icon = wrap.querySelector('.field-icon');
    var errEl = document.getElementById('err-' + name);
    var isValid = validators[name](input.value);
    var isRequired = requiredFields[name];

    icon.classList.remove('icon-valid', 'icon-invalid');
    input.removeAttribute('aria-invalid');
    if (errEl) errEl.textContent = '';

    if (!touched[name]) return;

    if (isValid) {
      icon.classList.add('icon-valid');
    } else if (isRequired) {
      icon.classList.add('icon-invalid');
      input.setAttribute('aria-invalid', 'true');
      if (errEl) errEl.textContent = 'Please enter a valid ' + name + '.';
    }
  }

  inputs.forEach(function (input) {
    input.addEventListener('input', function () { updateField(input.name); });
    input.addEventListener('blur', function () { touched[input.name] = true; updateField(input.name); });
  });

  /* ---------- Submit: no live endpoint, intercept + inline success ---------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    inputs.forEach(function (input) { touched[input.name] = true; updateField(input.name); });

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    form.hidden = true;
    document.getElementById('form-success').hidden = false;
  });
})();
</script>
</body>
</html>
