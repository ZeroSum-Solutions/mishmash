<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskora — Simplify Your Workflow. Stay Focused.</title>
<meta
	name="description"
	content="Taskora SaaS hero: a dark full-bleed video backdrop behind a glassmorphism pill navbar, a massive italic headline, and a light-mode product dashboard preview with stats, a revenue chart, and a deals table."
>
<link
	rel="icon"
	href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050505'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='%233b82f6' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
	href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Manrope:wght@400;500;600;700;800&family=Cabin:wght@500;600&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap"
	rel="stylesheet"
>
<style>
	:root {
		--bg: #050505;
		--fg: #ffffff;
		--muted: #9ca3af;
		--muted-2: #6b7280;
		--glass-bg: rgba(255, 255, 255, 0.08);
		--glass-bg-strong: rgba(255, 255, 255, 0.14);
		--glass-border: rgba(255, 255, 255, 0.14);
		--accent: #3b82f6;
		--accent-2: #22d3ee;
		--success: #16a34a;
		--success-tint: rgba(22, 163, 74, 0.12);
		--danger: #ef4444;
		--danger-tint: rgba(239, 68, 68, 0.12);
		--panel-bg: #f9f9fa;
		--panel-surface: #ffffff;
		--panel-fg: #101114;
		--panel-muted: #6b7280;
		--panel-border: rgba(16, 17, 20, 0.08);
		--ease-out: cubic-bezier(0.23, 1, 0.32, 1);
	}

	* {
		box-sizing: border-box;
	}

	html, body {
		margin: 0;
		padding: 0;
		background: var(--bg);
	}

	body {
		font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
		-webkit-font-smoothing: antialiased;
		color: var(--fg);
	}

	main {
		display: block;
	}

	a {
		color: inherit;
		text-decoration: none;
	}

	button {
		font: inherit;
	}

	.sr-only {
		position: absolute;
		width: 1px;
		height: 1px;
		padding: 0;
		margin: -1px;
		overflow: hidden;
		clip: rect(0, 0, 0, 0);
		white-space: nowrap;
		border: 0;
	}

	/* ---------------------------------------------------------------- */
	/* Navbar                                                          */
	/* ---------------------------------------------------------------- */

	.navbar {
		position: fixed;
		top: 18px;
		left: 50%;
		transform: translateX(-50%);
		z-index: 100;
		width: min(940px, calc(100% - 1.5rem));
	}

	.navbar-pill {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 0.75rem;
		padding: 0.55rem 0.6rem 0.55rem 1.25rem;
		background: var(--glass-bg);
		border: 1px solid var(--glass-border);
		border-radius: 999px;
		backdrop-filter: blur(18px) saturate(140%);
		-webkit-backdrop-filter: blur(18px) saturate(140%);
		box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
	}

	.nav-logo {
		display: inline-flex;
		align-items: center;
		gap: 0.5rem;
		font-family: 'Inter Tight', 'Inter', sans-serif;
		font-weight: 700;
		font-size: 1.05rem;
		letter-spacing: -0.01em;
		flex-shrink: 0;
	}

	.nav-logo-mark {
		width: 22px;
		height: 22px;
		border-radius: 7px;
		background: linear-gradient(135deg, var(--accent), var(--accent-2));
		display: inline-flex;
		align-items: center;
		justify-content: center;
	}

	.nav-links {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 1.75rem;
		list-style: none;
		margin: 0;
		padding: 0;
		flex: 1;
	}

	.nav-links a {
		font-family: 'Inter', sans-serif;
		font-size: 0.9rem;
		font-weight: 500;
		color: rgba(255, 255, 255, 0.85);
		transition: color 200ms var(--ease-out);
	}

	.nav-links a:hover {
		color: var(--fg);
	}

	.nav-auth {
		display: flex;
		align-items: center;
		gap: 0.6rem;
		flex-shrink: 0;
	}

	.nav-signup {
		font-family: 'Inter', sans-serif;
		font-size: 0.9rem;
		font-weight: 500;
		color: rgba(255, 255, 255, 0.85);
		padding: 0.5rem 0.4rem;
		transition: color 200ms var(--ease-out);
	}

	.nav-signup:hover {
		color: var(--fg);
	}

	.nav-signin {
		font-family: 'Inter', sans-serif;
		font-size: 0.88rem;
		font-weight: 600;
		background: var(--fg);
		color: var(--bg);
		padding: 0.55rem 1.15rem;
		border-radius: 999px;
		transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
	}

	.nav-signin:hover {
		transform: translateY(-1px);
		box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
	}

	.nav-toggle {
		display: none;
		width: 38px;
		height: 38px;
		flex-shrink: 0;
		border-radius: 999px;
		border: 1px solid var(--glass-border);
		background: transparent;
		cursor: pointer;
		position: relative;
	}

	.nav-toggle span {
		position: absolute;
		left: 10px;
		right: 10px;
		height: 1.5px;
		background: var(--fg);
		border-radius: 1px;
		transition: transform 220ms var(--ease-out), opacity 220ms var(--ease-out), top 220ms var(--ease-out);
	}

	.nav-toggle span:nth-child(1) { top: 13px; }
	.nav-toggle span:nth-child(2) { top: 18.5px; }
	.nav-toggle span:nth-child(3) { top: 24px; }

	.navbar.is-open .nav-toggle span:nth-child(1) {
		top: 18.5px;
		transform: rotate(45deg);
	}

	.navbar.is-open .nav-toggle span:nth-child(2) {
		opacity: 0;
	}

	.navbar.is-open .nav-toggle span:nth-child(3) {
		top: 18.5px;
		transform: rotate(-45deg);
	}

	.mobile-menu {
		display: grid;
		grid-template-rows: 0fr;
		opacity: 0;
		overflow: hidden;
		margin-top: 0.5rem;
		background: var(--glass-bg-strong);
		border: 1px solid var(--glass-border);
		border-radius: 22px;
		backdrop-filter: blur(18px) saturate(140%);
		-webkit-backdrop-filter: blur(18px) saturate(140%);
		transition: grid-template-rows 260ms var(--ease-out), opacity 200ms var(--ease-out);
	}

	.navbar.is-open .mobile-menu {
		grid-template-rows: 1fr;
		opacity: 1;
	}

	.mobile-menu-inner {
		min-height: 0;
		display: flex;
		flex-direction: column;
		padding: 0.5rem;
		gap: 0.15rem;
	}

	.mobile-menu-inner a {
		font-family: 'Inter', sans-serif;
		font-size: 0.95rem;
		font-weight: 500;
		padding: 0.7rem 0.9rem;
		border-radius: 12px;
		color: rgba(255, 255, 255, 0.9);
	}

	.mobile-menu-inner a:hover {
		background: rgba(255, 255, 255, 0.08);
	}

	.mobile-menu-inner .mobile-signin {
		margin-top: 0.35rem;
		background: var(--fg);
		color: var(--bg);
		font-weight: 600;
		text-align: center;
	}

	@media (max-width: 780px) {
		.nav-links,
		.nav-auth {
			display: none;
		}
		.nav-toggle {
			display: block;
		}
	}

	/* ---------------------------------------------------------------- */
	/* Hero                                                             */
	/* ---------------------------------------------------------------- */

	.hero {
		position: relative;
		min-height: 100vh;
		overflow: hidden;
		display: flex;
		flex-direction: column;
		align-items: center;
		background: var(--bg);
		padding: 150px 1.25rem 4rem;
	}

	.hero-bg,
	.hero-bg-fallback {
		position: absolute;
		inset: 0;
		width: 100%;
		height: 100%;
		object-fit: cover;
		opacity: 0.5;
		z-index: 0;
	}

	.hero-bg-fallback {
		display: none;
	}

	.hero-gradient {
		position: absolute;
		inset: 0;
		z-index: 1;
		background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6) 0%, var(--bg) 78%, var(--bg) 100%);
	}

	.hero-content {
		position: relative;
		z-index: 10;
		display: flex;
		flex-direction: column;
		align-items: center;
		text-align: center;
		width: 100%;
		max-width: 68rem;
		margin: 0 auto;
	}

	.reveal {
		opacity: 0;
		transform: translateY(24px);
	}

	.reveal.is-visible {
		animation: heroFadeUp 800ms var(--ease-out) forwards;
	}

	.badge {
		display: inline-flex;
		align-items: center;
		gap: 0.5rem;
		padding: 0.5rem 1.1rem 0.5rem 0.85rem;
		background: var(--glass-bg);
		border: 1px solid var(--glass-border);
		border-radius: 999px;
		font-family: 'Manrope', sans-serif;
		font-size: 0.8rem;
		font-weight: 600;
		color: rgba(255, 255, 255, 0.92);
		animation-delay: 0.05s;
	}

	.badge svg {
		flex-shrink: 0;
	}

	.hero-headline {
		margin: 1.4rem 0 0;
		font-family: 'Manrope', sans-serif;
		font-weight: 800;
		font-size: clamp(2.75rem, 7vw, 5rem);
		line-height: 1.08;
		letter-spacing: -0.02em;
		color: var(--fg);
		max-width: 46rem;
		animation-delay: 0.15s;
	}

	.hero-headline em {
		font-family: 'Instrument Serif', serif;
		font-style: italic;
		font-weight: 400;
		color: var(--fg);
	}

	.hero-subhead {
		margin: 1.25rem auto 0;
		max-width: 34rem;
		font-family: 'Manrope', sans-serif;
		font-size: clamp(1rem, 2vw, 1.15rem);
		font-weight: 400;
		line-height: 1.5;
		color: var(--muted);
		animation-delay: 0.28s;
	}

	.cta {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		margin-top: 2rem;
		padding: 0.95rem 2.15rem;
		background: var(--fg);
		color: var(--bg);
		font-family: 'Cabin', sans-serif;
		font-size: 0.98rem;
		font-weight: 600;
		border-radius: 999px;
		box-shadow: 0 10px 30px rgba(255, 255, 255, 0.08);
		cursor: pointer;
		transition: transform 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
		animation-delay: 0.4s;
	}

	.cta:hover {
		transform: scale(1.035);
		box-shadow: 0 14px 38px rgba(255, 255, 255, 0.16);
	}

	.cta:active {
		transform: scale(0.98);
		transition-duration: 140ms;
	}

	@keyframes heroFadeUp {
		from {
			opacity: 0;
			transform: translateY(24px);
		}
		to {
			opacity: 1;
			transform: translateY(0);
		}
	}

	/* ---------------------------------------------------------------- */
	/* Dashboard preview                                                */
	/* ---------------------------------------------------------------- */

	.dashboard-shot {
		margin: 3.5rem 0 0;
		width: min(1080px, 100%);
		animation-delay: 0.52s;
	}

	.dashboard-frame {
		border-radius: 22px;
		overflow: hidden;
		background: var(--panel-bg);
		box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.07);
	}

	.dash-grid {
		display: grid;
		grid-template-columns: 68px 1fr;
		min-height: 480px;
	}

	.dash-sidebar {
		background: var(--panel-surface);
		border-right: 1px solid var(--panel-border);
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 1rem;
		padding: 1.4rem 0;
	}

	.dash-sidebar-mark {
		width: 26px;
		height: 26px;
		border-radius: 8px;
		background: linear-gradient(135deg, var(--accent), var(--accent-2));
		margin-bottom: 0.6rem;
	}

	.dash-icon {
		width: 36px;
		height: 36px;
		border-radius: 10px;
		display: flex;
		align-items: center;
		justify-content: center;
		color: var(--panel-muted);
	}

	.dash-icon.is-active {
		background: rgba(59, 130, 246, 0.12);
		color: var(--accent);
	}

	.dash-main {
		display: flex;
		flex-direction: column;
		min-width: 0;
	}

	.dash-header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 1rem;
		padding: 1rem 1.5rem;
		border-bottom: 1px solid var(--panel-border);
	}

	.dash-search {
		display: flex;
		align-items: center;
		gap: 0.5rem;
		flex: 1;
		max-width: 260px;
		padding: 0.5rem 0.85rem;
		background: var(--panel-bg);
		border: 1px solid var(--panel-border);
		border-radius: 10px;
		color: var(--panel-muted);
		font-family: 'Inter', sans-serif;
		font-size: 0.8rem;
	}

	.dash-header-right {
		display: flex;
		align-items: center;
		gap: 1rem;
		flex-shrink: 0;
	}

	.dash-bell {
		position: relative;
		width: 34px;
		height: 34px;
		border-radius: 999px;
		display: flex;
		align-items: center;
		justify-content: center;
		color: var(--panel-muted);
		background: var(--panel-bg);
		border: 1px solid var(--panel-border);
	}

	.dash-bell::after {
		content: "";
		position: absolute;
		top: 7px;
		right: 8px;
		width: 6px;
		height: 6px;
		border-radius: 999px;
		background: var(--danger);
	}

	.dash-avatars {
		display: flex;
	}

	.dash-avatar {
		width: 30px;
		height: 30px;
		border-radius: 999px;
		display: flex;
		align-items: center;
		justify-content: center;
		font-family: 'Inter Tight', sans-serif;
		font-size: 0.65rem;
		font-weight: 600;
		color: #fff;
		border: 2px solid var(--panel-surface);
		margin-left: -8px;
	}

	.dash-avatars .dash-avatar:first-child {
		margin-left: 0;
	}

	.dash-body {
		flex: 1;
		padding: 1.25rem 1.5rem 1.5rem;
		display: flex;
		flex-direction: column;
		gap: 1.1rem;
		overflow-x: auto;
	}

	.stats-row {
		display: grid;
		grid-template-columns: repeat(3, minmax(160px, 1fr));
		gap: 1rem;
	}

	.stat-card {
		background: var(--panel-surface);
		border: 1px solid var(--panel-border);
		border-radius: 14px;
		padding: 1rem 1.1rem;
		display: flex;
		flex-direction: column;
		gap: 0.6rem;
	}

	.stat-label {
		font-family: 'Inter', sans-serif;
		font-size: 0.72rem;
		font-weight: 500;
		color: var(--panel-muted);
		text-transform: uppercase;
		letter-spacing: 0.04em;
	}

	.stat-value-row {
		display: flex;
		align-items: baseline;
		gap: 0.5rem;
	}

	.stat-value {
		font-family: 'Inter Tight', sans-serif;
		font-size: 1.35rem;
		font-weight: 700;
		color: var(--panel-fg);
	}

	.stat-trend {
		display: inline-flex;
		align-items: center;
		gap: 0.2rem;
		font-family: 'Inter', sans-serif;
		font-size: 0.72rem;
		font-weight: 600;
		padding: 0.15rem 0.45rem;
		border-radius: 999px;
	}

	.stat-trend.up {
		color: var(--success);
		background: var(--success-tint);
	}

	.stat-trend.down {
		color: var(--danger);
		background: var(--danger-tint);
	}

	.mini-bars {
		display: flex;
		align-items: flex-end;
		gap: 3px;
		height: 30px;
	}

	.mini-bars span {
		flex: 1;
		border-radius: 2px;
		background: var(--accent);
		opacity: 0.35;
		height: 6px;
		transform-origin: bottom;
		transition: height 700ms var(--ease-out);
	}

	.stat-card.is-danger .mini-bars span {
		background: var(--danger);
	}

	.dash-grid.is-visible .mini-bars span {
		height: var(--h);
	}

	.revenue-panel,
	.deals-panel {
		background: var(--panel-surface);
		border: 1px solid var(--panel-border);
		border-radius: 14px;
	}

	.panel-head {
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 1rem 1.25rem 0.25rem;
	}

	.panel-title {
		font-family: 'Inter Tight', sans-serif;
		font-size: 0.92rem;
		font-weight: 600;
		color: var(--panel-fg);
	}

	.panel-legend {
		display: inline-flex;
		align-items: center;
		gap: 0.4rem;
		font-family: 'Inter', sans-serif;
		font-size: 0.72rem;
		color: var(--panel-muted);
	}

	.panel-legend-dot {
		width: 8px;
		height: 8px;
		border-radius: 999px;
		background: linear-gradient(135deg, var(--accent), var(--accent-2));
	}

	.revenue-chart {
		display: flex;
		align-items: flex-end;
		gap: 4%;
		height: 140px;
		padding: 1.25rem 1.25rem 1rem;
	}

	.revenue-chart span {
		flex: 1;
		border-radius: 5px 5px 2px 2px;
		background: linear-gradient(180deg, var(--accent-2), var(--accent));
		opacity: 0.9;
		height: 8px;
		transition: height 900ms var(--ease-out);
	}

	.dash-grid.is-visible .revenue-chart span {
		height: var(--h);
	}

	.deals-table {
		width: 100%;
		border-collapse: collapse;
		font-family: 'Inter', sans-serif;
	}

	.deals-table th {
		text-align: left;
		font-size: 0.68rem;
		font-weight: 600;
		text-transform: uppercase;
		letter-spacing: 0.04em;
		color: var(--panel-muted);
		padding: 0.6rem 1.25rem;
		border-top: 1px solid var(--panel-border);
		border-bottom: 1px solid var(--panel-border);
		white-space: nowrap;
	}

	.deals-table td {
		padding: 0.7rem 1.25rem;
		font-size: 0.8rem;
		color: var(--panel-fg);
		border-bottom: 1px solid var(--panel-border);
		white-space: nowrap;
	}

	.deals-table tr:last-child td {
		border-bottom: none;
	}

	.deal-company {
		display: inline-flex;
		align-items: center;
		gap: 0.5rem;
	}

	.deal-logo {
		width: 22px;
		height: 22px;
		border-radius: 6px;
		display: inline-flex;
		align-items: center;
		justify-content: center;
		font-family: 'Inter Tight', sans-serif;
		font-size: 0.65rem;
		font-weight: 700;
		color: #fff;
		flex-shrink: 0;
	}

	.deal-owner {
		display: inline-flex;
		align-items: center;
		gap: 0.5rem;
	}

	.deal-owner .dash-avatar {
		margin-left: 0;
	}

	.stage-pill {
		display: inline-flex;
		align-items: center;
		padding: 0.2rem 0.6rem;
		border-radius: 999px;
		font-size: 0.7rem;
		font-weight: 600;
	}

	.stage-pill.new { color: var(--accent); background: rgba(59, 130, 246, 0.12); }
	.stage-pill.review { color: #b45309; background: rgba(217, 119, 6, 0.12); }
	.stage-pill.won { color: var(--success); background: var(--success-tint); }
	.stage-pill.lost { color: var(--panel-muted); background: rgba(107, 114, 128, 0.12); }

	@media (max-width: 900px) {
		.stats-row {
			grid-template-columns: 1fr;
		}
	}

	@media (max-width: 780px), (max-height: 700px) {
		.hero {
			padding-top: 118px;
		}
	}

	@media (max-width: 640px) {
		.dash-grid {
			grid-template-columns: 56px 1fr;
		}
		.dash-header {
			padding: 0.85rem 1rem;
		}
		.dash-search {
			max-width: 140px;
		}
		.dash-body {
			padding: 1rem;
		}
	}

	@media (max-width: 480px) {
		.hero {
			padding-top: 96px;
		}
		.hero-headline {
			font-size: clamp(2.4rem, 10vw, 3rem);
		}
	}

	/* ---------------------------------------------------------------- */
	/* Reduced motion                                                   */
	/* ---------------------------------------------------------------- */

	@media (prefers-reduced-motion: reduce) {
		.hero-bg {
			display: none;
		}

	<script>
		(function () {
			var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

			// Background/icon video playback, respecting reduced motion.
			var videos = document.querySelectorAll('video');
			videos.forEach(function (video) {
				if (reduceMotion) {
					video.removeAttribute('autoplay');
					video.pause();
				} else {
					var playPromise = video.play();
					if (playPromise && typeof playPromise.catch === 'function') {
						playPromise.catch(function () {});
					}
				}
			});

			// Staggered scroll/entrance reveals.
			var revealEls = document.querySelectorAll('.reveal');
			if (reduceMotion || !('IntersectionObserver' in window)) {
				revealEls.forEach(function (el) {
					el.classList.add('is-visible');
				});
			} else {
				var revealObserver = new IntersectionObserver(
					function (entries) {
						entries.forEach(function (entry) {
							if (entry.isIntersecting) {
								entry.target.classList.add('is-visible');
								revealObserver.unobserve(entry.target);
							}
						});
					},
					{ threshold: 0.15 }
				);
				revealEls.forEach(function (el) {
					revealObserver.observe(el);
				});
			}

			// Dashboard mini/revenue bar charts grow into view once, then stay.
			var dashGrid = document.getElementById('dashGrid');
			if (dashGrid) {
				if (reduceMotion || !('IntersectionObserver' in window)) {
					dashGrid.classList.add('is-visible');
				} else {
					var dashObserver = new IntersectionObserver(
						function (entries) {
							entries.forEach(function (entry) {
								if (entry.isIntersecting) {
									entry.target.classList.add('is-visible');
									dashObserver.unobserve(entry.target);
								}
							});
						},
						{ threshold: 0.2 }
					);
					dashObserver.observe(dashGrid);
				}
			}

			// Mobile nav toggle.
			var navbar = document.getElementById('navbar');
			var navToggle = document.getElementById('navToggle');
			var mobileMenu = document.getElementById('mobileMenu');

			function closeMenu() {
				navbar.classList.remove('is-open');
				navToggle.setAttribute('aria-expanded', 'false');
			}

			if (navToggle && navbar && mobileMenu) {
				navToggle.addEventListener('click', function () {
					var isOpen = navbar.classList.toggle('is-open');
					navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
				});

				mobileMenu.querySelectorAll('a').forEach(function (link) {
					link.addEventListener('click', closeMenu);
				});

				window.addEventListener('resize', function () {
					if (window.innerWidth > 780) {
						closeMenu();
					}
				});

				document.addEventListener('keydown', function (event) {
					if (event.key === 'Escape') {
						closeMenu();
					}
				});
			}

			// CTA click hook for host integrations.
			var cta = document.getElementById('ctaButton');
			if (cta) {
				cta.addEventListener('click', function () {
					cta.dispatchEvent(new CustomEvent('cta:demo', { bubbles: true }));
				});
			}
		})();
	</script>
