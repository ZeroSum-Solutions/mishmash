/* FadingVideo — custom JS crossfade looping video. No CSS transitions:
   every fade is rAF-driven, and looping is implemented manually via `ended`
   (the native `loop` attribute is OFF). */
(() => {
	const FADE_MS = 500;
	const FADE_OUT_LEAD = 0.55; // seconds before the end to start fading out

	function FadingVideo({ src, className, style }) {
		const videoRef = React.useRef(null);
		const rafRef = React.useRef(null);
		const fadingOutRef = React.useRef(false);

		React.useEffect(() => {
			const video = videoRef.current;
			if (!video) return undefined;

			// Reads the current opacity from video.style.opacity so each new fade
			// resumes from wherever the last one left off.
			const fadeTo = (target, duration = FADE_MS) => {
				if (rafRef.current !== null) cancelAnimationFrame(rafRef.current);
				const from = parseFloat(video.style.opacity || "0");
				const start = performance.now();
				const tick = (now) => {
					const t = Math.min((now - start) / duration, 1);
					video.style.opacity = String(from + (target - from) * t);
					if (t < 1) {
						rafRef.current = requestAnimationFrame(tick);
					} else {
						rafRef.current = null;
					}
				};
				rafRef.current = requestAnimationFrame(tick);
			};

			const onLoadedData = () => {
				video.style.opacity = "0";
				video.play().catch(() => {});
				fadeTo(1);
			};

			const onTimeUpdate = () => {
				const remaining = video.duration - video.currentTime;
				if (
					!fadingOutRef.current &&
					remaining <= FADE_OUT_LEAD &&
					remaining > 0
				) {
					fadingOutRef.current = true;
					fadeTo(0);
				}
			};

			const onEnded = () => {
				video.style.opacity = "0";
				setTimeout(() => {
					video.currentTime = 0;
					video.play().catch(() => {});
					fadingOutRef.current = false;
					fadeTo(1);
				}, 100);
			};

			video.addEventListener("loadeddata", onLoadedData);
			video.addEventListener("timeupdate", onTimeUpdate);
			video.addEventListener("ended", onEnded);

			// If the video was already buffered before listeners attached.
			if (video.readyState >= 2) onLoadedData();

			return () => {
				if (rafRef.current !== null) cancelAnimationFrame(rafRef.current);
				video.removeEventListener("loadeddata", onLoadedData);
				video.removeEventListener("timeupdate", onTimeUpdate);
				video.removeEventListener("ended", onEnded);
			};
		}, [src]);

		return (
			<video
				ref={videoRef}
				src={src}
				className={className}
				style={{ opacity: 0, ...style }}
				autoPlay
				muted
				playsInline
				preload="auto"
			/>
		);
	}

	window.FadingVideo = FadingVideo;
})();

/* BlurText — word-by-word blur-in headline, triggered at 10% visibility. */
(() => {
	const { motion } = window.Motion;

	const STEP_DURATION = 0.35;

	function BlurText({ text, className, delay = 100 }) {
		const ref = React.useRef(null);
		const [inView, setInView] = React.useState(false);

		React.useEffect(() => {
			const el = ref.current;
			if (!el) return undefined;
			const observer = new IntersectionObserver(
				([entry]) => {
					if (entry.isIntersecting) {
						setInView(true);
						observer.unobserve(el);
					}
				},
				{ threshold: 0.1 },
			);
			observer.observe(el);
			return () => observer.disconnect();
		}, []);

		const words = text.split(" ");

		return (
			<p
				ref={ref}
				className={className}
				style={{
					display: "flex",
					flexWrap: "wrap",
					justifyContent: "center",
					rowGap: "0.1em",
				}}
			>
				{words.map((word, i) => (
					<motion.span
						key={`${word}-${i}`}
						initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
						animate={
							inView
								? {
										filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
										opacity: [0, 0.5, 1],
										y: [50, -5, 0],
									}
								: { filter: "blur(10px)", opacity: 0, y: 50 }
						}
						transition={{
							duration: STEP_DURATION * 2,
							times: [0, 0.5, 1],
							ease: "easeOut",
							delay: (i * delay) / 1000,
						}}
						/* marginRight instead of a non-breaking space:
               letter-spacing -4px eats the nbsp. */
						style={{ display: "inline-block", marginRight: "0.28em" }}
					>
						{word}
					</motion.span>
				))}
			</p>
		);
	}

	window.BlurText = BlurText;
})();

							className="font-heading italic text-white text-6xl md:text-7xl lg:text-[6rem] leading-[0.9] tracking-[-3px]"
						>
							Production
							<br />
							evolved
						</motion.h2>
					</div>

					{/* Cards */}
					<div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16">
						{CARDS.map((card, i) => (
							<motion.div
								key={card.title}
								{...reveal(0.2 + i * 0.15)}
								className="liquid-glass rounded-[1.25rem] p-6 min-h-[360px] flex flex-col"
							>
								{/* Top row: icon + tags */}
								<div className="flex items-start justify-between gap-4">
									<div className="liquid-glass rounded-[0.75rem] w-11 h-11 flex items-center justify-center shrink-0">
										<MaterialIcon
											d={card.icon}
											className="h-6 w-6 text-white"
										/>
									</div>
									<div className="flex flex-wrap justify-end gap-1.5 max-w-[70%]">
										{card.tags.map((tag) => (
											<span
												key={tag}
												className="liquid-glass rounded-full px-3 py-1 text-[11px] text-white/90 font-body whitespace-nowrap"
											>
												{tag}
											</span>
										))}
									</div>
								</div>

								{/* Spacer */}
								<div className="flex-1" />

								{/* Bottom: title + body */}
								<div className="mt-6">
									<h3 className="font-heading italic text-white text-3xl md:text-4xl tracking-[-1px] leading-none">
										{card.title}
									</h3>
									<p className="mt-3 text-sm text-white/90 font-body font-light leading-snug max-w-[32ch]">
										{card.body}
									</p>
								</div>
							</motion.div>
						))}
					</div>
				</div>
			</section>
		);
	}

	window.Capabilities = Capabilities;
})();

		</script>

/* App — mounts the page on #root. */
(() => {
	const { Hero, Capabilities } = window;

	function App() {
		return (
			<main className="bg-black">
				<Hero />
				<Capabilities />
			</main>
		);
	}

	window.App = App;

	const root = ReactDOM.createRoot(document.getElementById("root"));
	root.render(<App />);
