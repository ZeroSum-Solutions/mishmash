<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>MONOCRIT STUDIO — Visual / Noise</title>
		<meta
			name="description"
			content="Monocrit Studio — independent art direction. An interactive monochrome portfolio hero."
		>
		<style>
/* ============ MONOCRIT — fonts ============ */







/* ============ tokens ============ */
:root {
	--paper: #f2f0eb;
	--ink: #0d0d0d;
	--red: #ff3b2f;
	--rule: rgba(13, 13, 13, 0.13);
	--muted: rgba(13, 13, 13, 0.58);
	--font:
		"Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI",
		Helvetica, Arial, sans-serif;
}

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}
html,
body {
	height: 100%;
}
body {
	font-family: var(--font);
	background: var(--paper);
	color: var(--ink);
	overflow: hidden;
	-webkit-font-smoothing: antialiased;
}

#app {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	cursor: none;
}

/* ============ paper grain ============ */
.grain {
	position: fixed;
	inset: 0;
	z-index: 1;
	pointer-events: none;
	opacity: 0.05;
	mix-blend-mode: multiply;
	background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* registration ticks */
.reg {
	position: fixed;
	width: 22px;
	height: 22px;
	z-index: 2;
	pointer-events: none;
	opacity: 0.32;
}
.reg::before,
.reg::after {
	content: "";
	position: absolute;
	background: var(--ink);
}
.reg::before {
	width: 100%;
	height: 1px;
	top: 50%;
}
.reg::after {
	height: 100%;
	width: 1px;
	left: 50%;
}
.reg--tl {
	top: 26px;
	left: 26px;
}
.reg--tr {
	top: 26px;
	right: 26px;
}
.reg--bl {
	bottom: 26px;
	left: 26px;
}
.reg--br {
	bottom: 26px;
	right: 26px;
}

/* ============ bars ============ */
.bar {
	position: fixed;
	left: 0;
	width: 100%;
	z-index: 60;
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 26px 34px;
	mix-blend-mode: difference;
	color: #fff;
	pointer-events: none;
}
.bar--top {
	top: 0;
}
.bar--bottom {
	bottom: 0;
}
.bar__cell {
	font-size: 11px;
	font-weight: 600;
	letter-spacing: 0.28em;
	text-transform: uppercase;
	white-space: nowrap;
}
.mark {
	font-weight: 800;
	font-size: 15px;
	letter-spacing: 0.18em;
	display: flex;
	align-items: baseline;
	gap: 2px;
}
.mark__c {
	font-size: 10px;
	opacity: 0.7;
}
.meta-center {
	display: flex;
	gap: 12px;
	align-items: center;
	font-weight: 500;
	letter-spacing: 0.22em;
	font-variant-numeric: tabular-nums;
}
.meta-center .sep {
	opacity: 0.5;
}
.status {
	display: flex;
	align-items: center;
	gap: 10px;
}
.dot {
	width: 7px;
	height: 7px;
	border-radius: 50%;
	background: var(--red);
	box-shadow: 0 0 0 0 var(--red);
	animation: pulse 2.4s infinite;
	mix-blend-mode: normal;
}
@keyframes pulse {
	0% {
		box-shadow: 0 0 0 0 rgba(255, 59, 47, 0.6);
	}
	70% {
		box-shadow: 0 0 0 9px rgba(255, 59, 47, 0);
	}
	100% {
		box-shadow: 0 0 0 0 rgba(255, 59, 47, 0);
	}
}
.hint .arr {
	display: inline-block;
	margin-left: 4px;
}

/* ============ hero ============ */
.hero {
	position: relative;
	z-index: 10;
	flex: 1;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	text-align: center;
	padding: 0 28px;
}
.eyebrow {
	font-size: 12px;
	font-weight: 600;
	letter-spacing: 0.34em;
	text-transform: uppercase;
	color: var(--muted);
	margin-bottom: 34px;
}

.headline {
	font-weight: 800;
	text-transform: uppercase;
	font-size: clamp(3.5rem, 12.5vw, 12rem);
	line-height: 0.82;
	letter-spacing: -0.045em;
	display: flex;
	flex-direction: column;
	align-items: center;
	user-select: none;
}
.headline .line {
	display: flex;
	overflow: visible;
}
.headline .char {
	display: inline-block;
	transition:
		transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
		color 0.3s;
}
.line--outline .char {
	color: transparent;
	-webkit-text-stroke: 2px var(--ink);
	text-stroke: 2px var(--ink);
}

/* entrance */
[data-anim] {
	opacity: 0;
	transform: translateY(18px);
	transition:
		opacity 0.9s ease,
		transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
}
.is-in [data-anim] {
	opacity: 1;
	transform: none;
}
.is-in .eyebrow {
	transition-delay: 0.05s;
}
.is-in .meta-row {
	transition-delay: 0.55s;
}
.char {
	opacity: 0;
	transform: translateY(110%);
}
.is-in .char {
	opacity: 1;
	transform: translateY(0);
	transition:
		transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
		opacity 0.6s ease;
}

/* meta row */
.meta-row {
	margin-top: 46px;
	width: min(760px, 92vw);
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: 28px;
	border-top: 1px solid var(--rule);
	padding-top: 24px;
}
.lede {
	text-align: left;
	max-width: 300px;
	font-size: 13px;
	line-height: 1.65;
	letter-spacing: 0.04em;
	text-transform: uppercase;
	color: var(--muted);
}
.actions {
	display: flex;
	gap: 12px;
	flex-shrink: 0;
}
.btn {
	pointer-events: auto;
	cursor: none;
	font-size: 11px;
	font-weight: 700;
	letter-spacing: 0.18em;
	text-transform: uppercase;
	padding: 13px 22px;
	border-radius: 40px;
	border: 1px solid var(--ink);
	text-decoration: none;
	transition:
		background 0.35s,
		color 0.35s,
		transform 0.35s;
	display: inline-block;
}
.btn--ghost {
	color: var(--ink);
	background: transparent;
}
.btn--ghost:hover {
	background: var(--ink);
	color: var(--paper);
}
.btn--solid {
	background: var(--ink);
	color: var(--paper);
}
.btn--solid:hover {
	background: var(--red);
	border-color: var(--red);
	color: #fff;
	transform: translateY(-2px);
}

/* ============ floating card ============ */
.card {
	position: fixed;
	top: 0;
	left: 0;
	z-index: 40;
	width: 190px;
	height: 250px;
	transform: translate(-50%, -50%);
	pointer-events: none;
	opacity: 0;
	will-change: transform, opacity;
	transition: opacity 0.4s ease;
}
.card__stack {
	position: absolute;
	inset: 0;
	border-radius: 7px;
	overflow: hidden;
	box-shadow:
		0 26px 50px -18px rgba(13, 13, 13, 0.55),
		0 3px 10px rgba(13, 13, 13, 0.2);
	background: var(--ink);
}
.card__stack img {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	object-fit: cover;
	opacity: 0;
	filter: grayscale(0.32) contrast(1.04);
	transition: opacity 0.45s ease;
}
.card__stack img.is-active {
	opacity: 1;
}
.card__cap {
	position: absolute;
	left: 0;
	bottom: 0;
	width: 100%;
	z-index: 3;
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 9px 12px;
	font-size: 9px;
	font-weight: 700;
	letter-spacing: 0.16em;
	text-transform: uppercase;
	color: #fff;
	background: linear-gradient(to top, rgba(13, 13, 13, 0.78), transparent);
}
#cap-num {
	color: var(--red);
}

/* mini ring cursor */
.ring {
	position: fixed;
	top: 0;
	left: 0;
	z-index: 45;
	width: 74px;
	height: 74px;
	border: 1px solid var(--ink);
	border-radius: 50%;
	transform: translate(-50%, -50%) scale(0.4);
	display: grid;
	place-items: center;
	pointer-events: none;
	opacity: 0;
	transition:
		opacity 0.3s,
		transform 0.3s;
	mix-blend-mode: difference;
}
.ring.is-on {
	opacity: 1;
	transform: translate(-50%, -50%) scale(1);
}
#ring-label {
	font-size: 9px;
	font-weight: 700;
	letter-spacing: 0.12em;
	text-transform: uppercase;
	color: #fff;
}

/* footer dots */
.dots {
	display: flex;
	gap: 8px;
	pointer-events: none;
}
.dots i {
	width: 5px;
	height: 5px;
	border-radius: 50%;
	background: #fff;
	opacity: 0.32;
	transition:
		opacity 0.3s,
		transform 0.3s;
}
.dots i.is-on {
	opacity: 1;
	transform: scale(1.7);
}

/* ============ responsive ============ */
@media (max-width: 900px) {
	.meta-center {
		display: none;
	}
	.meta-row {
		flex-direction: column;
		align-items: center;
		text-align: center;
		gap: 24px;
	}
	.lede {
		text-align: center;
	}
}
@media (max-width: 560px) {
	.bar {
		padding: 20px;
	}
	.eyebrow {
		margin-bottom: 24px;
		font-size: 10px;
		letter-spacing: 0.26em;
	}
	.meta-row {
		margin-top: 34px;
	}
}

/* coarse pointer / touch: static card mode */
@media (hover: none), (pointer: coarse) {
	#app {
		cursor: auto;
	}
	.btn {
		cursor: pointer;
	}
	.ring {
		display: none;
	}
	.card {
		opacity: 1;
		left: auto;
		right: 24px;
		bottom: 78px;
		top: auto;
		transform: none;
		width: 128px;
		height: 170px;
	}
}

@media (prefers-reduced-motion: reduce) {
	* {
		animation-duration: 0.001ms;
		transition-duration: 0.001ms;
	}
	.char {
		opacity: 1;
		transform: none;
	}
	.card {
		transition: none;
	}
}

		</style>
	
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;400;500;600;700;800&display=swap">
	</head>
	<body>
		<div id="app">
			<!-- Paper grain + registration marks -->
			<div class="grain" aria-hidden="true"></div>
			<div class="reg reg--tl" aria-hidden="true"></div>
			<div class="reg reg--tr" aria-hidden="true"></div>
			<div class="reg reg--bl" aria-hidden="true"></div>
			<div class="reg reg--br" aria-hidden="true"></div>

			<!-- Header -->
			<header class="bar bar--top">
				<div class="bar__cell mark">MONOCRIT<span class="mark__c">©</span></div>
				<div class="bar__cell meta-center">
					<span id="clock">00:00:00</span>
					<span class="sep">/</span>
					<span>40.71°N 74.00°W</span>
				</div>
				<div class="bar__cell status">
					<span class="dot" aria-hidden="true"></span>
					Available for Freelance
				</div>
			</header>

			<!-- Hero -->
			<main class="hero" id="hero">
				<p class="eyebrow" data-anim>Independent Art Direction — Est. 2024</p>

				<h1 class="headline" id="headline" aria-label="Visual Noise">
					<span class="line" data-word="visual">VISUAL</span>
					<span class="line line--outline" data-word="noise">NOISE</span>
				</h1>

				<div class="meta-row" data-anim>
					<p class="lede">
						A studio for art direction, motion &amp; brand systems — built to
						cut through the visual noise.
					</p>
					<div class="actions">
						<a href="#" class="btn btn--ghost" data-cursor="index"
							>View Index</a
						>
						<a href="#" class="btn btn--solid" data-cursor="say hi"
							>Get in Touch</a
						>
					</div>
				</div>
			</main>

			<!-- Floating cursor card -->
			<div class="card" id="card" aria-hidden="true">
				<div class="card__stack" id="stack">
					<img src="assets/work-1.jpg" alt="" class="is-active">
					<img src="assets/work-2.jpg" alt="">
					<img src="assets/work-3.jpg" alt="">
					<img src="assets/work-4.jpg" alt="">
					<img src="assets/work-5.jpg" alt="">
					<img src="assets/work-6.jpg" alt="">
				</div>
				<div class="card__cap">
					<span id="cap-name">FIELD STUDY</span>
					<span id="cap-num">01 / 06</span>
				</div>
			</div>

			<!-- Mini ring cursor (over interactive) -->
			<div class="ring" id="ring" aria-hidden="true">
				<span id="ring-label"></span>
			</div>

			<!-- Footer -->
			<footer class="bar bar--bottom">
				<div class="bar__cell">Selected Works — 06</div>
				<div class="dots" id="dots" aria-hidden="true"></div>
				<div class="bar__cell hint">
					Move cursor to explore <span class="arr">↗</span>
				</div>
			</footer>
		</div>

		<script>
(() => {
	var app = document.getElementById("app");
	var hero = document.getElementById("hero");
	var headline = document.getElementById("headline");
	var card = document.getElementById("card");
	var ring = document.getElementById("ring");
	var ringLabel = document.getElementById("ring-label");
	var stack = document.getElementById("stack");
	var imgs = Array.prototype.slice.call(stack.querySelectorAll("img"));
	var capName = document.getElementById("cap-name");
	var capNum = document.getElementById("cap-num");
	var dotsWrap = document.getElementById("dots");

	var CAPTIONS = [
		"FIELD STUDY",
		"TYPE SPECIMEN",
		"MOTION FRAME",
		"BRAND MARK",
		"EDITORIAL",
		"STILL LIFE",
	];
	var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
	var coarse = window.matchMedia("(hover: none), (pointer: coarse)").matches;

	/* ---- split headline into chars ---- */
	var chars = [];
	headline.querySelectorAll(".line").forEach((line) => {
		var text = line.textContent;
		line.textContent = "";
		for (var i = 0; i < text.length; i++) {
			var s = document.createElement("span");
			s.className = "char";
			s.textContent = text[i];
			line.appendChild(s);
			chars.push(s);
		}
	});

	/* ---- footer dots ---- */
	imgs.forEach((_, i) => {
		var d = document.createElement("i");
		if (i === 0) d.className = "is-on";
		dotsWrap.appendChild(d);
	});
	var dots = Array.prototype.slice.call(dotsWrap.children);

	/* ---- entrance ---- */
	chars.forEach((c, i) => {
		c.style.transitionDelay = `${0.18 + i * 0.035}s`;
	});
	requestAnimationFrame(() => {
		requestAnimationFrame(() => {
			app.classList.add("is-in");
		});
	});

	/* ---- live clock ---- */
	var clock = document.getElementById("clock");
	function tick() {
		var d = new Date();
		function p(n) {
			return n < 10 ? `0${n}` : `${n}`;
		}
		clock.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
	}
	tick();
	setInterval(tick, 1000);

	/* ---- image cycling ---- */
	var current = 0;
	function setImage(n) {
		imgs[current].classList.remove("is-active");
		dots[current].classList.remove("is-on");
		current = (n + imgs.length) % imgs.length;
		imgs[current].classList.add("is-active");
		dots[current].classList.add("is-on");
		capName.textContent = CAPTIONS[current];
		capNum.textContent = `${(current + 1 < 10 ? "0" : "") + (current + 1)} / 06`;
	}

	/* ============ TOUCH / REDUCED-MOTION: auto cycle ============ */
	if (coarse || reduce) {
		var _auto = setInterval(() => {
			setImage(current + 1);
		}, 1800);
		if (reduce && !coarse) {
			// keep a static centred card visible
			card.style.opacity = "1";
			card.style.left = "50%";
			card.style.top = "50%";
		}
		// still split chars but no magnetism
		return;
	}

	/* ============ DESKTOP: cursor-driven ============ */
	var pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
	var pos = { x: pointer.x, y: pointer.y };
	var prev = { x: pointer.x, y: pointer.y };
	var travel = 0;
	var THRESHOLD = 70;
	var overInteractive = false;

	document.addEventListener("mousemove", (e) => {
		pointer.x = e.clientX;
		pointer.y = e.clientY;

		var t = e.target;
		var interactive = t.closest ? t.closest("[data-cursor]") : null;
		overInteractive = !!interactive;
		if (interactive) {
			ring.classList.add("is-on");
			ringLabel.textContent = interactive.getAttribute("data-cursor") || "";
		} else {
			ring.classList.remove("is-on");
		}

		// accumulate travel for image swaps
		travel += Math.hypot(pointer.x - prev.x, pointer.y - prev.y);
		if (!overInteractive && travel > THRESHOLD) {
			travel = 0;
			setImage(current + 1);
		}
		prev.x = pointer.x;
		prev.y = pointer.y;

		// magnetic letters
		for (var i = 0; i < chars.length; i++) {
			var r = chars[i].getBoundingClientRect();
			var cx = r.left + r.width / 2;
			var cy = r.top + r.height / 2;
			var dx = pointer.x - cx;
			var dy = pointer.y - cy;
			var dist = Math.hypot(dx, dy);
			if (dist < 150) {
				var ang = Math.atan2(dy, dx);
				var push = (150 - dist) / 8;
				chars[i].style.transform =
					"translate(" +
					-Math.cos(ang) * push +
					"px," +
					-Math.sin(ang) * push +
					"px)";
			} else {
				chars[i].style.transform = "translate(0,0)";
			}
		}
	});

	hero.addEventListener("mouseleave", () => {
		chars.forEach((c) => {
			c.style.transform = "translate(0,0)";
		});
	});

	// hide native; show card after first real move
	var seen = false;
	document.addEventListener("mousemove", function once() {
		seen = true;
		document.removeEventListener("mousemove", once);
	});

	/* ---- ring follows instantly ---- */
	function moveRing() {
		ring.style.left = `${pointer.x}px`;
		ring.style.top = `${pointer.y}px`;
	}

	/* ---- card lerps with inertia + velocity skew ---- */
	function loop() {
		pos.x += (pointer.x - pos.x) * 0.16;
		pos.y += (pointer.y - pos.y) * 0.16;

		var vx = pointer.x - pos.x;
		var vy = pointer.y - pos.y;
		var rot = Math.max(-12, Math.min(12, vx * 0.14));
		var skew = Math.max(-7, Math.min(7, vy * 0.06));

		card.style.transform =
			"translate(" +
			pos.x +
			"px," +
			pos.y +
			"px) translate(-50%,-50%) rotate(" +
			rot +
			"deg) skewY(" +
			skew +
			"deg)";
		card.style.opacity = seen && !overInteractive ? "1" : "0";

		moveRing();
		requestAnimationFrame(loop);
	}
	// card uses top/left 0 baseline; override transform translate
	card.style.left = "0px";
	card.style.top = "0px";
	requestAnimationFrame(loop);
})();

		</script>
	</body>
</html>
