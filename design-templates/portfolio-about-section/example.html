<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>About Me — Portfolio Section</title>
<meta name="description" content="Dark, gradient-lit About Me section with a scroll-revealed bio paragraph, four floating 3D corner icons, and a gradient contact button." />


<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --bg: #0c0c0c;
    --paragraph-color: #d7e2ea;
    --heading-grad-top: #646973;
    --heading-grad-bottom: #bbccd7;
    --accent-1: #18011f;
    --accent-2: #b600a8;
    --accent-3: #7621b0;
    --accent-4: #be4c00;
    --focus-ring: #b600a8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--paragraph-color);
    font-family: 'Kanit', sans-serif;
  }

  body {
    min-height: 100vh;
  }

  img { max-width: 100%; display: block; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  a.contact-btn:focus-visible,
  img.corner-img:focus-visible {
    outline: 3px solid var(--focus-ring);
    outline-offset: 3px;
  }

  /* ---- Section shell ---- */
  .about-hero {
    position: relative;
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    overflow: hidden;
  }
  @media (min-width: 640px) {
    .about-hero { padding: 80px 32px; }
  }
  @media (min-width: 768px) {
    .about-hero { padding: 80px 40px; }
  }

  /* ---- Decorative corner images ---- */
  .corner-img {
    position: absolute;
    z-index: 0;
    height: auto;
    pointer-events: none;
    user-select: none;
  }

  .corner-tl { top: 4%; left: 1%; width: 120px; }
  @media (min-width: 640px) { .corner-tl { left: 2%; width: 160px; } }
  @media (min-width: 768px) { .corner-tl { left: 4%; width: 210px; } }

  .corner-bl { bottom: 8%; left: 3%; width: 100px; }
  @media (min-width: 640px) { .corner-bl { left: 6%; width: 140px; } }
  @media (min-width: 768px) { .corner-bl { left: 10%; width: 180px; } }

  .corner-tr { top: 4%; right: 1%; width: 120px; }
  @media (min-width: 640px) { .corner-tr { right: 2%; width: 160px; } }
  @media (min-width: 768px) { .corner-tr { right: 4%; width: 210px; } }

  .corner-br { bottom: 8%; right: 3%; width: 130px; }
  @media (min-width: 640px) { .corner-br { right: 6%; width: 170px; } }
  @media (min-width: 768px) { .corner-br { right: 10%; width: 220px; } }

  /* ---- Fade-in mount animation (shared) ---- */
  .fade-in {
    opacity: 0;
    transform: translate(var(--fade-x, 0px), var(--fade-y, 30px));
    transition:
      opacity var(--fade-duration, 0.7s) cubic-bezier(0.25, 0.1, 0.25, 1) var(--fade-delay, 0s),
      transform var(--fade-duration, 0.7s) cubic-bezier(0.25, 0.1, 0.25, 1) var(--fade-delay, 0s);
    will-change: opacity, transform;
  }
  .fade-in.is-visible {
    opacity: 1;
    transform: translate(0, 0);
  }

  /* ---- Center content ---- */
  .center-content {
    position: relative;
    z-index: 10;
    max-width: 896px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 64px;
  }
  @media (min-width: 640px) { .center-content { gap: 80px; } }
  @media (min-width: 768px) { .center-content { gap: 96px; } }

  .content-group-text {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    width: 100%;
  }
  @media (min-width: 640px) { .content-group-text { gap: 56px; } }
  @media (min-width: 768px) { .content-group-text { gap: 64px; } }

  .content-group-cta { display: flex; }

  /* ---- Heading ---- */
  .hero-heading {
    margin: 0;
    width: 100%;
    max-width: 100%;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 1;
    letter-spacing: -0.025em;
    text-align: center;
    font-size: clamp(3rem, 12vw, 160px);
    background: linear-gradient(180deg, var(--heading-grad-top) 0%, var(--heading-grad-bottom) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ---- Paragraph ---- */
  .about-paragraph {
    color: var(--paragraph-color);
    font-weight: 500;
    text-align: center;
    line-height: 1.625;
    max-width: 560px;
    margin: 0 auto;
    font-size: clamp(1rem, 2vw, 1.35rem);
  }

  .char-wrap { position: relative; display: inline-block; }
  .char-ghost { visibility: hidden; }
  .char-visible { position: absolute; left: 0; top: 0; opacity: 0.2; }

  /* ---- Contact button ---- */
  .contact-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9999px;
    padding: 12px 32px;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #ffffff;
    text-decoration: none;
    background: linear-gradient(123deg, var(--accent-1) 7%, var(--accent-2) 37%, var(--accent-3) 72%, var(--accent-4) 100%);
    box-shadow: 0px 4px 4px rgba(181, 1, 167, 0.25), 4px 4px 12px #7721b1 inset;
    outline: 2px solid #e3e3e3;
    outline-offset: -3px;
    transition: opacity 200ms;
    cursor: pointer;
  }
  @media (min-width: 640px) {
    .contact-btn { padding: 14px 40px; font-size: 14px; }
  }
  @media (min-width: 768px) {
    .contact-btn { padding: 16px 48px; font-size: 16px; }
  }
  .contact-btn:hover { opacity: 0.9; }
  .contact-btn:active { opacity: 0.75; }

  /* ---- Reduced motion: dignified static fallback ---- */
  @media (prefers-reduced-motion: reduce) {
    .fade-in {
      transition: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>
<section class="about-hero" id="about" aria-label="About me">

  <img
    class="fade-in corner-img corner-tl"
    src="assets/moon-icon.png"
    alt=""
    aria-hidden="true"
    loading="lazy"
    style="--fade-x:-80px; --fade-y:0px; --fade-delay:0.1s; --fade-duration:0.9s;"
  />
  <img
    class="fade-in corner-img corner-bl"
    src="assets/smiley-3d.png"
    alt=""
    aria-hidden="true"
    loading="lazy"
    style="--fade-x:-80px; --fade-y:0px; --fade-delay:0.25s; --fade-duration:0.9s;"
  />
  <img
    class="fade-in corner-img corner-tr"
    src="assets/lego-icon.png"
    alt=""
    aria-hidden="true"
    loading="lazy"
    style="--fade-x:80px; --fade-y:0px; --fade-delay:0.15s; --fade-duration:0.9s;"
  />
  <img
    class="fade-in corner-img corner-br"
    src="assets/cursor-3d.png"
    alt=""
    aria-hidden="true"
    loading="lazy"
    style="--fade-x:80px; --fade-y:0px; --fade-delay:0.3s; --fade-duration:0.9s;"
  />

  <div class="center-content">

    <div class="content-group-text">
      <h1
        class="fade-in hero-heading"
        style="--fade-x:0px; --fade-y:40px; --fade-delay:0s; --fade-duration:0.7s;"
      >About me</h1>

      <p class="about-paragraph" id="about-copy">With more than five years of experience in design, i focus on branding, web design, and user experience, i truly enjoy working with businesses that aim to stand out and present their best image. Let's build something incredible together!</p>
      <p class="about-paragraph" id="about-copy-animated" aria-hidden="true" hidden></p>
    </div>

    <div class="content-group-cta">
      <a
        class="fade-in contact-btn"
        href="#contact"
        style="--fade-x:0px; --fade-y:20px; --fade-delay:0.3s; --fade-duration:0.7s;"
      >Contact Me</a>
    </div>

  </div>

</section>

<script>
(function () {
  'use strict';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- 1. Mount fade-ins: corner icons, heading, button ---- */
  var fadeEls = Array.prototype.slice.call(document.querySelectorAll('.fade-in'));

  if (reduceMotion || !('IntersectionObserver' in window)) {
    fadeEls.forEach(function (el) { el.classList.add('is-visible'); });
  } else {
    var io = new IntersectionObserver(function (entries, observer) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { root: null, rootMargin: '50px', threshold: 0 });

    fadeEls.forEach(function (el) { io.observe(el); });
  }

  /* ---- 2. Scroll-driven per-character paragraph reveal ---- */
  var staticP = document.getElementById('about-copy');
  var animP = document.getElementById('about-copy-animated');

  if (reduceMotion || !staticP || !animP) {
    return;
  }

  var text = staticP.textContent;
  var chars = text.split('');
  var total = chars.length;
  var spans = [];
  var frag = document.createDocumentFragment();

  chars.forEach(function (ch, i) {
    var glyph = ch === ' ' ? ' ' : ch;

    var wrap = document.createElement('span');
    wrap.className = 'char-wrap';

    var ghost = document.createElement('span');
    ghost.className = 'char-ghost';
    ghost.textContent = glyph;

    var visible = document.createElement('span');
    visible.className = 'char-visible';
    visible.textContent = glyph;
    visible.style.opacity = '0.2';

    wrap.appendChild(ghost);
    wrap.appendChild(visible);
    frag.appendChild(wrap);

    spans.push({ el: visible, charProgress: i / total });
  });

  animP.appendChild(frag);
  animP.hidden = false;
  staticP.classList.add('sr-only');

  var ticking = false;

  function updateOpacity() {
    ticking = false;

    var rect = animP.getBoundingClientRect();
    var vh = window.innerHeight;
    var startTop = 0.8 * vh;
    var endTop = 0.2 * vh - rect.height;
    var denom = startTop - endTop;
    var scrollProgress = denom !== 0 ? (startTop - rect.top) / denom : 0;
    scrollProgress = Math.min(1, Math.max(0, scrollProgress));

    spans.forEach(function (s) {
      var start = Math.max(0, s.charProgress - 0.1);
      var end = Math.min(1, s.charProgress + 0.05);
      var t;
      if (scrollProgress <= start) {
        t = 0;
      } else if (scrollProgress >= end) {
        t = 1;
      } else {
        t = (scrollProgress - start) / (end - start);
      }
      var opacity = 0.2 + t * (1 - 0.2);
      s.el.style.opacity = opacity.toFixed(3);
    });
  }

  function onScroll() {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(updateOpacity);
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  updateOpacity();
})();
</script>
</body>
</html>
