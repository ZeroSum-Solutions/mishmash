name: Setup Playwright
description: Restore Playwright browser cache and install browsers

inputs:
  package-json-path:
    description: Path to package.json containing @playwright/test or playwright devDependency
    required: true
  install-command:
    description: Command used to install browsers
    required: true
  runner-labels:
    description: JSON array of labels selected for this job's runs-on value
    required: false
    default: '[]'

runs:
  using: composite
  steps:
    - name: Detect persistent Playwright cache
      id: persistent-playwright-cache
      shell: bash
      env:
        RUNNER_LABELS_JSON: ${{ inputs.runner-labels }}
      run: |
        case "$RUNNER_LABELS_JSON" in
          *'"od-persistent-ci"'*) persistent_enabled=true ;;
          *) persistent_enabled=false ;;
        esac

        if [ "$persistent_enabled" = "true" ]; then
          if [ -z "${PLAYWRIGHT_BROWSERS_PATH:-}" ]; then
            echo "runner-labels contains od-persistent-ci, but PLAYWRIGHT_BROWSERS_PATH is not set" >&2
            exit 1
          fi
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "path=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: |
        version=$(node -p "const pkg = require('./${{ inputs.package-json-path }}'); const deps = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) }; (deps['@playwright/test'] || deps.playwright || '').replace(/[^0-9.]/g,'')")
        if [ -z "$version" ]; then
          echo "Could not resolve Playwright version from ${{ inputs.package-json-path }}" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Detect Blacksmith runner
      id: blacksmith
      shell: bash
      env:
        RUNNER_LABELS_JSON: ${{ inputs.runner-labels }}
      run: |
        case "$RUNNER_LABELS_JSON" in
          *'"blacksmith-'*) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "enabled=false" >> "$GITHUB_OUTPUT" ;;
        esac

    # Blacksmith jobs restore from Blacksmith's colocated cache (same key/path contract as actions/cache,
    # served next to the runner instead of from GitHub's cache backend); everything else keeps actions/cache.
    - name: Cache Playwright browser binaries (Blacksmith)
      if: ${{ steps.persistent-playwright-cache.outputs.enabled != 'true' && steps.blacksmith.outputs.enabled == 'true' }}
      uses: useblacksmith/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Cache Playwright browser binaries
      if: ${{ steps.persistent-playwright-cache.outputs.enabled != 'true' && steps.blacksmith.outputs.enabled != 'true' }}
      uses: actions/cache@v5.0.5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    # `playwright install --with-deps` runs apt on every job; an apt mirror hiccup returns exit 100 and once
    # failed three jobs of one PR outright (#192). Retry the install up to three times before failing the job.
    # A mirror can also hang instead of failing: on #213 `apt-get update` sat on a dead us.archive.ubuntu.com
    # connection for 19 minutes and the 20-minute job cap cancelled the job before attempt 2 could run. Each
    # attempt is therefore bounded; with a warm browser cache a healthy install finishes in well under a minute.
    - name: Install Playwright browsers
      shell: bash
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
        ATTEMPT_TIMEOUT: 5m
      run: |
        for attempt in 1 2 3; do
          if timeout --kill-after=30s "$ATTEMPT_TIMEOUT" bash -c "$INSTALL_COMMAND"; then exit 0; fi
          echo "playwright install attempt $attempt failed or timed out after $ATTEMPT_TIMEOUT" >&2
          sleep $((attempt * 15))
        done
        exit 1
